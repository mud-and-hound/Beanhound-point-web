<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEANHOUND Reports</title>
<style>
:root{
 color-scheme:light;--bg:#f5f5f2;--paper:#fff;--ink:#242522;--muted:#66685f;--line:#e0e1d9;--soft:#f1f2ed;
 --accent:#795438;--accent-soft:#f4ebdf;--danger:#ad352b;--hover:#faf8f3;--scroll:#93968b;
 --radius:14px;--control-radius:9px;--pill:999px;--font:Prompt,system-ui,sans-serif;
 --text:12px;--heading:24px;--subheading:15px;--metric:28px;--brand:17px;--small:11px;
 --metric-width:232px;--metric-height:92px;--metric-columns:4;--metric-pad:16px;--metric-value-gap:4px;--metric-icon:26px;
 --page-pad:24px;--panel-pad:16px;--gap:12px;--space:24px;--control:38px;
 --icon:18px;--mascot:42px;--avatar:30px;--cell-min:64px;--cell-width:190px;--cell-preview:2.9em;
 --cell-expanded:240px;--row-pad:12px;--profile-width:174px;--device-width:280px;--table-min:150px;
 --table-line:#d3d5ca;--table-head:#eeefe8;--table-stripe:#fafaf7;--table-hover:var(--accent-soft);--table-rule:1px;--table-head-rule:2px;--cell-pad-x:12px;--head-pad-y:6px;--sort-icon:13px;--sort-gap:4px;--sort-pad-y:3px;
 --page-max:1680px;--login-width:400px;--table-max:62vh;--line-height:1.65;--motion:140ms;
 --scrollbar:10px;--focus:2px;--dialog-width:480px;--dialog-backdrop:#24252266;--summary-gap:8px;--row-number:#7a7d72;--date-width:420px;--date-time-columns:3;--date-message-height:3.5em;--export-radio:18px;--export-message-height:1.8em;
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--scroll) var(--soft)}
::-webkit-scrollbar{width:var(--scrollbar);height:var(--scrollbar)}
::-webkit-scrollbar-thumb{background:var(--scroll);border:2px solid var(--soft);border-radius:var(--pill)}
::-webkit-scrollbar-track{background:var(--soft)}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--text)/var(--line-height) var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select{font:inherit}
button,a,input,select,summary{touch-action:manipulation}
button{min-height:var(--control);padding:8px 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);border-radius:var(--control-radius);background:var(--ink);color:var(--paper);cursor:pointer;font-weight:500;transition:background var(--motion),border-color var(--motion),transform var(--motion)}
button.secondary{background:var(--paper);color:var(--ink);border-color:var(--line)}
button:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:var(--paper)}
button.secondary:hover:not(:disabled){background:var(--soft);border-color:var(--muted);color:var(--ink)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:var(--focus) solid var(--accent);outline-offset:3px}
input,select{width:100%;height:var(--control);padding:8px 10px;border:1px solid var(--line);border-radius:var(--control-radius);background:var(--paper);color:var(--ink)}
input:hover,select:hover{border-color:var(--muted)}
input:disabled,select:disabled{background:var(--soft);color:var(--muted)}
label{display:block;margin-bottom:6px;font-size:var(--small);font-weight:500;color:var(--muted)}
header{padding:14px var(--page-pad);display:flex;justify-content:space-between;align-items:center;gap:var(--space);background:var(--paper);border-bottom:1px solid var(--line)}
.brand-lockup{display:flex;align-items:center;gap:var(--gap)}
.brand{font:700 var(--brand) Arial,sans-serif;letter-spacing:.15em}
.byline{font-size:10px;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.brand-stamp{width:var(--mascot);height:var(--mascot);display:grid;place-items:center;border-radius:var(--control-radius);background:var(--ink);color:var(--paper)}
.brand-stamp .mascot{width:28px;height:28px}
.icon,.mascot{display:inline-block;flex-shrink:0;width:var(--icon);height:var(--icon);background:currentColor;mask:var(--icon-url) center/contain no-repeat;-webkit-mask:var(--icon-url) center/contain no-repeat;vertical-align:middle}
main{max-width:var(--page-max);margin:auto;padding:0 var(--page-pad) var(--space)}
h1{font-size:var(--heading);line-height:1.4;letter-spacing:-.025em;margin:0 0 5px;font-weight:600}
h2{font-size:var(--subheading);margin:0;font-weight:500}
p{margin:0;color:var(--muted)}
#status{min-height:1.8em;margin:8px 0 6px;color:var(--muted);font-size:var(--small)}
#status[data-error=true]{color:var(--danger)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:var(--gap);margin-bottom:var(--panel-pad)}
.eyebrow{font-size:10px;letter-spacing:.12em;color:var(--accent);margin-bottom:6px}
#timezone{font-size:var(--small);white-space:nowrap}
.metrics{display:grid;grid-template-columns:repeat(var(--metric-columns),minmax(0,1fr));grid-auto-rows:1fr;max-width:calc(var(--metric-width) * var(--metric-columns) + var(--gap) * (var(--metric-columns) - 1));gap:var(--gap);margin:0 0 var(--summary-gap)}
.metric{min-width:0;min-height:var(--metric-height);padding:var(--metric-pad);background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;align-content:center;column-gap:var(--gap);row-gap:var(--metric-value-gap)}
.metric>.icon{grid-column:2;grid-row:1/3;width:var(--metric-icon);height:var(--metric-icon);color:var(--accent)}
.metric span[data-copy]{min-width:0;overflow-wrap:anywhere;color:var(--muted);font-size:var(--small)}
.metric strong{display:block;min-width:0;overflow-wrap:anywhere;grid-column:1;font:500 var(--metric)/1.25 var(--font);font-variant-numeric:tabular-nums}
.summary-note{font-size:var(--small);margin:0 0 var(--panel-pad)}
.filters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--gap);padding:var(--panel-pad);background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:var(--panel-pad)}
.search-row,.password-row{display:flex;gap:8px}.search-row input,.password-row input{min-width:0}.password-row button{flex-shrink:0}
.filter-actions{grid-column:span 2;display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.filter-note{grid-column:span 4;align-self:center;font-size:var(--small)}
.report{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.report-head{display:flex;justify-content:space-between;align-items:center;gap:var(--panel-pad);padding:var(--panel-pad);border-bottom:1px solid var(--line)}
.report-heading{display:flex;gap:var(--gap);align-items:center}.report-heading>.icon{color:var(--accent)}
.report-heading>div{display:flex;align-items:center;gap:var(--gap)}
#count{padding:2px 8px;border-radius:var(--pill);background:var(--soft);font-size:var(--small)}
.export-actions{display:flex;gap:8px;flex-wrap:wrap}
.table-scroll{overflow:auto;min-height:var(--table-min);max-height:var(--table-max)}
.table-scroll>table{border-collapse:separate;border-spacing:0;width:100%;font-size:var(--text);text-align:center}
.table-scroll caption{padding:10px var(--panel-pad);text-align:left;color:var(--muted);font-size:var(--small)}
.table-scroll th,.table-scroll td{border-bottom:var(--table-rule) solid var(--table-line);vertical-align:middle;text-align:center;padding:var(--row-pad) var(--cell-pad-x)}
.table-scroll th:not(:last-child),.table-scroll td:not(:last-child){border-inline-end:var(--table-rule) solid var(--table-line)}
.table-scroll th{background:var(--table-head);font-weight:500;position:sticky;top:0;z-index:1;white-space:nowrap;padding:var(--head-pad-y) var(--cell-pad-x);border-bottom-width:var(--table-head-rule)}
.table-scroll td{min-width:var(--cell-min);max-width:var(--cell-width)}
.table-scroll td.number{font-variant-numeric:tabular-nums}
.table-scroll tbody tr:nth-child(even){background:var(--table-stripe)}
.table-scroll tbody tr:hover,.table-scroll tbody tr:focus-within{background:var(--table-hover)}
.sort-button{position:relative;display:flex;justify-content:center;width:100%;padding:var(--sort-pad-y) calc(var(--sort-icon) + var(--sort-gap));text-align:center;background:transparent;color:var(--ink);border:0;border-radius:0;font-size:var(--small)}
.sort-button:hover:not(:disabled){background:transparent;color:var(--accent)}
.sort-arrow{position:absolute;inset-inline-end:0;width:var(--sort-icon);height:var(--sort-icon);color:var(--muted);opacity:.55}
.table-scroll th[aria-sort=ascending],.table-scroll th[aria-sort=descending]{background:var(--accent-soft);border-bottom-color:var(--accent)}
.table-scroll th[aria-sort=ascending] .sort-arrow,.table-scroll th[aria-sort=descending] .sort-arrow{color:var(--accent);opacity:1}
.cell-value{white-space:pre-wrap;overflow-wrap:anywhere;max-height:var(--cell-preview);overflow:hidden}
.cell-short{max-height:none}
.cell-detail{width:auto;margin-inline:auto}
.cell-detail summary{min-height:var(--control);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--accent);font-size:var(--small)}
.cell-detail summary::before{content:"+"}.cell-detail[open] summary::before{content:"−"}
.cell-detail[open] .cell-value{max-height:var(--cell-expanded);overflow:auto}
.table-scroll td.profile-cell{min-width:var(--profile-width)}
.profile-person{display:flex;align-items:center;justify-content:center;gap:8px}
.profile-avatar{width:var(--avatar);height:var(--avatar);border-radius:var(--pill);object-fit:cover;background:var(--soft);flex-shrink:0}
.profile-name{overflow-wrap:anywhere}.profile-note{font-size:var(--small);color:var(--muted)}
.profile-detail{width:auto}
.device-button{padding:0;width:var(--control);color:var(--muted)}
.device-detail{width:var(--control)}
.device-detail summary{list-style:none;display:flex;align-items:center;justify-content:center;width:var(--control);height:var(--control);border:1px solid var(--line);border-radius:var(--control-radius);cursor:pointer;color:var(--muted);background:var(--paper)}
.device-detail summary:hover,.device-detail[open] summary{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.device-detail summary::-webkit-details-marker{display:none}
.device-detail[open]{width:var(--device-width)}
.device-info{margin-top:var(--gap);padding:var(--gap);border:1px solid var(--line);border-radius:var(--control-radius);background:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere;max-height:var(--cell-expanded);overflow:auto;font-size:var(--small)}
dialog{width:min(var(--dialog-width),calc(100% - var(--space)));max-height:calc(100dvh - var(--space));overflow:auto;margin:auto;padding:var(--space);border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);color:var(--ink)}
dialog::backdrop{background:var(--dialog-backdrop)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:var(--gap);margin-bottom:var(--gap)}
#device-value{white-space:pre-wrap;overflow-wrap:anywhere;font:var(--text)/var(--line-height) var(--font);padding:var(--panel-pad);background:var(--soft);border-radius:var(--control-radius);max-height:var(--cell-expanded);overflow:auto}
#table-feedback{padding:var(--space);text-align:center}#table-feedback button{margin-top:var(--gap)}
#applied-range{font-size:var(--small);padding:8px var(--panel-pad);border-bottom:1px solid var(--line)}
#empty{padding:48px var(--space);text-align:center}
.pagination{display:flex;justify-content:space-between;align-items:center;gap:var(--gap);padding:12px var(--panel-pad)}
.pagination>div{display:flex;gap:8px}.pagination p{font-size:var(--small)}
footer{padding:var(--gap) 0;color:var(--muted);font-size:var(--small)}
#login-panel{max-width:var(--login-width);margin:8vh auto var(--space);padding:32px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius)}
#login-panel form{margin-top:var(--space);display:grid;gap:var(--panel-pad)}
@media(max-width:1199px){.filters{grid-template-columns:repeat(3,minmax(0,1fr))}.filter-actions{grid-column:1}.filter-note{grid-column:span 2}.export-actions button{padding:8px 10px}}
@media(max-width:850px){:root{--page-pad:16px;--heading:22px;--metric-columns:2}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filter-actions{grid-column:span 2}.filter-note{grid-column:1/-1}.report-head{align-items:start;flex-direction:column}.topline{align-items:start}#timezone{white-space:normal;text-align:right}}
@media(max-width:500px){:root{--page-pad:12px;--panel-pad:12px;--metric:24px;--metric-pad:12px;--metric-icon:22px;--gap:10px;--brand:15px}.topline{display:block}#timezone{text-align:left;margin-top:8px}.filters{grid-template-columns:1fr}.filter-actions,.filter-note{grid-column:1}.filter-actions button{flex:1}.export-actions{width:100%}.export-actions button:first-child{width:100%}.export-actions button.secondary{flex:1}.report-heading>div{flex-wrap:wrap}.pagination{flex-wrap:wrap}.byline{font-size:9px}header{gap:8px}#logout{padding:8px}#logout>.icon{display:none}#login-panel{padding:var(--space);margin-top:var(--space)}}
@media(pointer:coarse){:root{--control:44px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

.date-trigger{width:100%;justify-content:space-between;text-align:left;font-weight:400;white-space:normal}
.date-trigger span:first-child{min-width:0}
#date-dialog{width:min(var(--date-width),calc(100% - var(--space)));padding:var(--panel-pad)}
#date-form{display:grid;gap:var(--gap)}
#date-help{font-size:var(--small)}
#date-calendar,calendar-month{width:100%;inline-size:100%;font:inherit;--color-accent:var(--accent);--color-text-on-accent:var(--paper)}
#date-calendar::part(button){font:inherit;min-height:var(--control);padding:0 var(--gap);background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:var(--control-radius)}
#date-calendar::part(button):hover{background:var(--soft);border-color:var(--muted)}
#date-calendar::part(button):focus-visible,calendar-month::part(button):focus-visible{outline:var(--focus) solid var(--accent);outline-offset:0}
#date-calendar::part(heading){font-size:var(--subheading)}
calendar-month::part(table){width:100%;table-layout:fixed;font:inherit}
calendar-month::part(heading){font-weight:500;color:var(--accent)}
calendar-month::part(th){font-weight:400;color:var(--muted)}
calendar-month::part(button){width:100%;inline-size:100%;height:var(--control);block-size:var(--control);border-radius:var(--control-radius);font:inherit}
calendar-month::part(button):hover{background:var(--accent-soft);color:var(--ink)}
calendar-month::part(selected){background:var(--accent);color:var(--paper)}
calendar-month::part(today){box-shadow:inset 0 0 0 1px var(--accent)}
.date-time{display:grid;grid-template-columns:repeat(var(--date-time-columns),minmax(0,1fr));gap:var(--gap)}
#date-message{min-height:var(--date-message-height);font-size:var(--small);color:var(--accent)}
#date-message[data-error=true]{color:var(--danger)}
.date-actions{display:flex;gap:var(--gap);justify-content:flex-end}
.date-actions button{flex:1}
#export-form{display:grid;gap:var(--gap)}
#export-help,#export-range{font-size:var(--small)}
#export-range{padding:var(--gap);border-radius:var(--control-radius);background:var(--soft)}
.export-options{border:0;padding:0;margin:0;display:grid;gap:var(--gap);min-width:0}
.export-options legend{padding:0;margin-bottom:var(--summary-gap);color:var(--muted);font-size:var(--small)}
.export-option{display:flex;gap:var(--gap);align-items:center;padding:var(--panel-pad);border:1px solid var(--line);border-radius:var(--control-radius);margin:0;cursor:pointer;color:var(--ink)}
.export-option:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.export-option:has(input:focus-visible){outline:var(--focus) solid var(--accent);outline-offset:var(--focus)}
.export-option input{width:var(--export-radio);height:var(--export-radio);flex-shrink:0;padding:0;margin:0;accent-color:var(--accent)}
.export-option strong{display:block;font-size:var(--subheading);font-weight:500}
.export-option small{display:block;color:var(--muted);font-size:var(--small);font-weight:400}
#export-error{min-height:var(--export-message-height);font-size:var(--small)}
#export-error[data-error=true]{color:var(--danger)}
[aria-invalid=true]{outline:var(--focus) solid var(--danger);outline-offset:0}
</style>
</head>
<body>
<header><div class="brand-lockup"><span class="brand-stamp"><span class="mascot" data-icon="hound" aria-hidden="true"></span></span><div><div class="brand" data-copy="brand"></div><div class="byline" data-copy="byline"></div></div></div><button id="logout" class="secondary" data-copy="logout" data-button-icon="logout" hidden></button></header>
<main>
<section id="login-panel" aria-labelledby="login-title">
  <p class="eyebrow" data-copy="workspace"></p><h1 id="login-title" data-copy="loginTitle"></h1><p data-copy="loginHint"></p>
  <form id="login-form" novalidate>
    <div><label for="username" data-copy="username"></label><input id="username" autocomplete="username" required aria-describedby="status"></div>
    <div><label for="password" data-copy="password"></label><div class="password-row"><input id="password" type="password" autocomplete="current-password" required aria-describedby="status"><button type="button" id="toggle-password" class="secondary" data-copy="showPassword" aria-pressed="false"></button></div></div>
    <button id="login-button" type="submit" data-copy="login"></button>
  </form>
</section>
<p id="status" role="status" aria-live="polite"></p>
<section id="dashboard" hidden aria-labelledby="report-title">
 <div class="topline"><div><p class="eyebrow" data-copy="workspace"></p><h1 tabindex="-1" id="report-title" data-copy="reportTitle"></h1><p data-copy="intro"></p></div><p id="timezone"></p></div>
 <div class="metrics" id="metrics">
  <div class="metric"><span class="icon" data-icon="receipt" aria-hidden="true"></span><span data-copy="claims"></span><strong id="metric-claims">—</strong></div>
  <div class="metric"><span class="icon" data-icon="beans" aria-hidden="true"></span><span data-copy="points"></span><strong id="metric-points">—</strong></div>
  <div class="metric"><span class="icon" data-icon="scan" aria-hidden="true"></span><span data-copy="scans"></span><strong id="metric-scans">—</strong></div>
  <div class="metric"><span class="icon" data-icon="repeat" aria-hidden="true"></span><span data-copy="duplicates"></span><strong id="metric-duplicates">—</strong></div>
 </div>
 <p class="summary-note" data-copy="summaryNote"></p>
 <form id="filter-form" class="filters" novalidate>
  <div><label for="kind" data-copy="dataset"></label><select id="kind"></select></div>
  <div><label for="start-picker" data-copy="start"></label><input type="hidden" id="start"><button type="button" id="start-picker" class="secondary date-trigger" aria-haspopup="dialog" aria-controls="date-dialog" aria-describedby="status"><span id="start-label"></span><span class="icon" data-icon="calendar" aria-hidden="true"></span></button></div>
  <div><label for="end-picker" data-copy="end"></label><input type="hidden" id="end"><button type="button" id="end-picker" class="secondary date-trigger" aria-haspopup="dialog" aria-controls="date-dialog" aria-describedby="status"><span id="end-label"></span><span class="icon" data-icon="calendar" aria-hidden="true"></span></button></div>
  <div><label for="shop" data-copy="shop"></label><select id="shop"></select></div>
  <div><label for="bill" data-copy="bill"></label><div class="search-row"><input id="bill" type="search" autocomplete="off"><button type="submit" id="search-bill" data-copy="search"></button><button type="button" id="clear-search" class="secondary" data-copy="clear" hidden></button></div></div>
  <div><label for="result" data-copy="result"></label><select id="result"></select></div>
  <div class="filter-actions"><button type="button" id="clear-filters" class="secondary" data-copy="clearFilters" data-button-icon="repeat"></button></div>
  <p class="filter-note" id="filter-note"></p>
 </form>
 <section class="report" aria-labelledby="table-title">
  <div class="report-head"><div class="report-heading"><span class="icon" data-icon="receipt" aria-hidden="true"></span><div><h2 id="table-title"></h2><p id="count"></p></div></div><div class="export-actions"><button id="export-open" data-copy="exportOpen" data-button-icon="download" aria-haspopup="dialog" aria-controls="export-dialog" disabled></button></div></div>
  <p id="applied-range"></p><div id="table-feedback" hidden><p id="table-error" role="status"></p><button id="report-retry" type="button" data-copy="retry"></button></div><div class="table-scroll" tabindex="0" role="region" aria-labelledby="caption"><table><caption id="caption"></caption><thead id="thead"></thead><tbody id="tbody"></tbody></table><p id="empty" data-copy="empty" hidden></p></div>
  <div class="pagination"><p id="page-info"></p><div><button id="prev" class="secondary" data-copy="prev" data-button-icon="previous"></button><button id="next" class="secondary" data-copy="next" data-button-icon="next"></button></div></div>
 </section>
 <footer data-copy="footer"></footer>
</section>
</main>
<dialog id="export-dialog" aria-labelledby="export-title" aria-describedby="export-help">
 <form id="export-form" novalidate>
  <h2 id="export-title" data-copy="exportTitle"></h2><p id="export-help" data-copy="exportHelp"></p>
  <p id="export-range"></p>
  <fieldset class="export-options"><legend data-copy="exportChoose"></legend>
   <label class="export-option" for="export-summary"><input id="export-summary" name="export-mode" type="radio" value="summary" checked><span><strong data-copy="exportSummary"></strong><small id="export-summary-hint"></small></span></label>
   <label class="export-option" for="export-detail"><input id="export-detail" name="export-mode" type="radio" value="detail"><span><strong data-copy="exportDetail"></strong><small id="export-detail-hint"></small></span></label>
  </fieldset>
  <p id="export-error" role="status" aria-live="polite"></p>
  <div class="date-actions"><button id="export-cancel" type="button" class="secondary" data-copy="exportCancel"></button><button id="export-confirm" type="submit" data-copy="exportExcel" data-button-icon="download"></button></div>
 </form>
</dialog>
<dialog id="device-dialog" aria-labelledby="device-title" aria-describedby="device-source">
 <div class="dialog-head"><h2 id="device-title"></h2><button id="device-close" type="button" class="secondary" data-copy="close"></button></div>
 <p id="device-source" data-copy="deviceSource"></p><div id="device-value"></div>

<script id="app-main">
'use strict';
const $=id=>document.getElementById(id);
const state={token:null,page:1,pages:1,busy:false,meta:null,controller:null,generation:0,appliedFilters:null,appliedColumns:[],deviceTrigger:null,dateDraft:null,sort:'',direction:'asc'};
const number=new Intl.NumberFormat(CONFIG.locale,CONFIG.numberOptions);
const dates=new Intl.DateTimeFormat(CONFIG.locale,CONFIG.dateOptions);
const dateLabels=new Intl.DateTimeFormat(CONFIG.locale,{...CONFIG.calendar.displayOptions,timeZone:CONFIG.timezone});
const calendarReady=import(CONFIG.calendar.script).then(()=>true,()=>false);
const copy=(key,values={})=>Object.entries(values).reduce((s,[k,v])=>s.replaceAll('{'+k+'}',v),CONFIG.messages[key]);
function status(message='',error=false){$('status').textContent=message;$('status').dataset.error=String(error);}
function busy(value){state.busy=value;document.querySelectorAll('button,input,select').forEach(el=>el.disabled=value);$('prev').disabled=value||state.page<=1;$('next').disabled=value||state.page>=state.pages;$('export-open').disabled=value||!state.appliedFilters;$('dashboard').setAttribute('aria-busy',String(value));}
function lock(message){state.generation++;state.token=null;state.meta=null;state.appliedFilters=null;state.appliedColumns=[];if($('export-dialog').open)$('export-dialog').close();if($('date-dialog').open)$('date-dialog').close();if($('device-dialog').open)$('device-dialog').close();$('device-value').textContent='';$('device-title').textContent='';$('table-feedback').hidden=true;$('applied-range').textContent='';for(const key of ['claims','points','scans','duplicates'])$('metric-'+key).textContent=copy('dash');$('count').textContent='';$('page-info').textContent='';$('password').type='password';$('toggle-password').textContent=copy('showPassword');$('toggle-password').setAttribute('aria-pressed','false');$('password').value='';$('tbody').replaceChildren();$('thead').replaceChildren();$('dashboard').hidden=true;$('login-panel').hidden=false;$('logout').hidden=true;status(message,true);$('username').disabled=false;$('username').focus();}
async function api(path,options={}){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),CONFIG.timeoutMs);
 const requestToken=state.token;const headers={...(requestToken?{Authorization:'Bearer '+requestToken}:{}),...options.headers};
 try{
  const response=await fetch(CONFIG.API_URL+CONFIG.prefix+path,{...options,headers,signal:controller.signal,cache:'no-store',credentials:'omit'});
  if(!response.ok){let body;try{body=await response.json();}catch{}if(response.status===CONFIG.unauthorizedStatus&&requestToken&&state.token===requestToken)lock(copy('session'));throw new Error(typeof body?.detail==='string'?body.detail:copy('error'));}
  return response;
 }finally{clearTimeout(timer);}
}
function filters(){return {start:$('start').value,end:$('end').value,shop:$('shop').value,bill:$('bill').value.trim(),status:$('result').value,sort:state.sort,direction:state.direction,sort_report:$('kind').value};}
function params(extra={},committed=false){return new URLSearchParams({...committed?state.appliedFilters:filters(),...extra});}
function refreshDateLabels(){for(const key of ['start','end'])$(key+'-label').textContent=$(key).value?dateLabels.format(new Date($(key).value+CONFIG.offset)):copy('dash');}
function dateMessage(message,error=false){$('date-message').textContent=message;$('date-message').dataset.error=String(error);}
function clearDateError(){$('date-calendar').removeAttribute('aria-invalid');for(const unit of CONFIG.calendar.units)$('date-'+unit.key).removeAttribute('aria-invalid');dateMessage(copy('datePending'));}
async function openDate(target){
 if(state.busy||!state.token)return;
 if(!await calendarReady){status(copy('dateUnavailable'),true);return;}
 if(state.busy||!state.token||$('date-dialog').open)return;
 const [day,time]=$(target).value.split('T'),parts=time.split(':');
 state.dateDraft={target,trigger:$(target+'-picker')};
 const calendar=$('date-calendar');calendar.locale=CONFIG.calendar.locale;calendar.firstDayOfWeek=CONFIG.calendar.firstDayOfWeek;calendar.formatWeekday=CONFIG.calendar.formatWeekday;calendar.today=state.meta.start.split('T')[0];calendar.value=day;calendar.focusedDate=day;calendar.getDayParts=date=>'date-'+date.toISOString().split('T')[0];
 CONFIG.calendar.units.forEach((unit,index)=>{$('date-'+unit.key).value=parts[index]||String(CONFIG.calendar.timeMin).padStart(CONFIG.calendar.digits,'0');});
 $('date-title').textContent=copy(target);clearDateError();$('date-dialog').showModal();
 await calendar.updated;await calendar.querySelector('calendar-month').updated;
 if($('date-dialog').open)calendar.focus();
}
async function confirmDate(event){
 event.preventDefault();if(state.busy||!state.dateDraft)return;
 const inputs=CONFIG.calendar.units.map(unit=>$('date-'+unit.key));const invalid=inputs.find(input=>input.value===''||!input.validity.valid);
 if(invalid){dateMessage(copy('dateInvalidTime'),true);invalid.setAttribute('aria-invalid','true');invalid.focus();return;}
 const draft=state.dateDraft;const value=$('date-calendar').value+'T'+inputs.map(input=>String(Number(input.value)).padStart(CONFIG.calendar.digits,'0')).join(':');
 const start=draft.target==='start'?value:$('start').value,end=draft.target==='end'?value:$('end').value;
 if(!Number.isFinite(new Date(value+CONFIG.offset).valueOf())||new Date(start+CONFIG.offset)>new Date(end+CONFIG.offset)){
  dateMessage(copy('invalidRange'),true);$('date-calendar').setAttribute('aria-invalid','true');$('date-calendar').focus();return;
 }
 $(draft.target).value=value;refreshDateLabels();$('date-dialog').close();state.page=1;await load();
 if(state.token&&draft.trigger.isConnected&&!draft.trigger.disabled)draft.trigger.focus();
}
function option(value,label){const el=document.createElement('option');el.value=value;el.textContent=label;return el;}
function fieldValue(key,value,row={}){
 if(value===null||value===undefined||value==='')return copy('dash');
 if(key==='reward_received')return CONFIG.rewardStates[Number(value)===1&&!row.reward_clicked_at?'legacy':value]||String(value);
 if(key==='result')return CONFIG.statuses[value]||value;
 if(CONFIG.numeric.includes(key))return number.format(Number(value));
 if(CONFIG.timestamps.includes(key)){const date=new Date(String(value).replace(' ','T')+CONFIG.offset);if(!Number.isNaN(date.valueOf()))return dates.format(date);}
 return typeof value==='object'?JSON.stringify(value):String(value);
}
function localIcon(name,className='icon'){const icon=document.createElement('span');icon.className=className;icon.setAttribute('aria-hidden','true');icon.dataset.icon=name;icon.style.setProperty('--icon-url','url("'+CONFIG.icons[name]+'")');return icon;}
function renderProfile(td,row){
 td.className='profile-cell';const person=document.createElement('div');person.className='profile-person';
 const avatar=document.createElement('img'),name=document.createElement('span');avatar.className='profile-avatar';avatar.alt='';avatar.src=CONFIG.icons.profile;name.className='profile-name';
 const id=row.line_user_id;const displayName=id&&row[CONFIG.profileFields.name];name.textContent=displayName||(id?copy('lineProfileMissing'):copy('lineMissing'));if(!displayName)name.classList.add('profile-note');
 if(id&&row[CONFIG.profileFields.picture]){try{const url=new URL(row[CONFIG.profileFields.picture]);if(CONFIG.profileProtocols.includes(url.protocol)){avatar.referrerPolicy='no-referrer';avatar.addEventListener('error',()=>{avatar.src=CONFIG.icons.profile;},{once:true});avatar.src=url.href;}}catch{}}
 person.append(avatar,name);td.append(person);
 if(id){const detail=document.createElement('details'),summary=document.createElement('summary'),value=document.createElement('div');detail.className='cell-detail profile-detail';summary.textContent=copy('lineDetail');value.className='cell-value';value.textContent=copy('lineId')+': '+String(id);detail.append(summary,value);td.append(detail);}
}
function renderDevice(td,value){
 if(!value){td.textContent=copy('deviceMissing');return;}
 const button=document.createElement('button');button.type='button';button.className='secondary device-button';button.setAttribute('aria-label',copy('deviceDetail'));button.title=copy('deviceDetail');button.append(localIcon('phone'));
 button.addEventListener('click',()=>{state.deviceTrigger=button;$('device-title').textContent=CONFIG.deviceRules.find(rule=>rule.tokens.some(token=>String(value).toLowerCase().includes(token.toLowerCase())))?.label||copy('deviceUnknown');$('device-value').textContent=String(value);$('device-dialog').showModal();});td.append(button);
}
function render(data){
 state.page=data.page;state.pages=data.pages;$('table-title').textContent=CONFIG.datasets[$('kind').value];$('count').textContent=copy('records',{count:number.format(data.total)});
 $('page-info').textContent=copy('page',{page:number.format(data.page),pages:number.format(data.pages)});$('thead').replaceChildren();$('tbody').replaceChildren();$('empty').hidden=data.total!==0;
 const columns=$('kind').value==='claims'?CONFIG.claimColumns.filter(key=>data.columns.includes(key)):data.columns;state.appliedColumns=[...columns];const head=document.createElement('tr');
 for(const key of columns){const th=document.createElement('th'),button=document.createElement('button');th.scope='col';button.type='button';button.className='sort-button';button.dataset.sort=key;const label=CONFIG.columns[key]||copy('unknownColumn');button.textContent=label;const active=state.sort===key;const next=active&&state.direction==='asc'?'desc':'asc';button.setAttribute('aria-label',copy('sortHint',{column:label,direction:copy(next)}));th.setAttribute('aria-sort',active?CONFIG.sortDirections[state.direction]:'none');const arrow=localIcon(CONFIG.sortIcons[active?state.direction:'none'],'icon sort-arrow');button.append(arrow);button.addEventListener('click',()=>{if(state.busy)return;state.sort=key;state.direction=next;state.page=1;load().then(()=>{Array.from(document.querySelectorAll('.sort-button')).find(el=>el.dataset.sort===key)?.focus({preventScroll:true});});});th.append(button);head.append(th);}$('thead').append(head);
 for(const row of data.rows){const tr=document.createElement('tr');for(const key of columns){const td=document.createElement('td');if(key==='line_user_id'){renderProfile(td,row);tr.append(td);continue;}if(key==='user_agent'){renderDevice(td,row[key]);tr.append(td);continue;}const value=fieldValue(key,row[key],row);const content=document.createElement('div');content.className='cell-value';content.textContent=value;
if(value.length>CONFIG.cellPreviewChars||value.includes('\n')){const detail=document.createElement('details'),summary=document.createElement('summary');detail.className='cell-detail';summary.textContent=copy('detail');const preview=document.createElement('div');preview.className='cell-value';preview.textContent=value.slice(0,CONFIG.cellPreviewChars)+copy('ellipsis');td.append(preview);detail.append(summary,content);detail.addEventListener('toggle',()=>{preview.hidden=detail.open;summary.textContent=copy(detail.open?'collapse':'detail');});td.append(detail);}else{content.classList.add('cell-short');td.append(content);}if(CONFIG.numeric.includes(key))td.className='number';tr.append(td);}$('tbody').append(tr);}

}
function datasetControls(){const dated=CONFIG.dated.includes($('kind').value);for(const id of ['start','end','start-picker','end-picker','shop','bill','search-bill','clear-search','clear-filters'])$(id).disabled=!dated;$('result').disabled=$('kind').value!=='attempts';$('filter-note').textContent=copy(dated?'rangeNote':'configNote');}
function validate(){const valid=Boolean($('start').value&&$('end').value&&$('start').value<=$('end').value);for(const id of ['start-picker','end-picker'])$(id).setAttribute('aria-invalid',String(!valid));if(!valid){status(copy('invalidRange'),true);$('start-picker').focus();}return valid;}
async function load(){
 if(state.busy||!state.token||!validate())return;const generation=++state.generation;const applied=filters();busy(true);$('table-feedback').hidden=true;status(copy('loading'));
 try{const query=new URLSearchParams({...applied,page:state.page});const [report,summary]=await Promise.all([api('/reports/'+$('kind').value+'?'+query).then(r=>r.json()),api('/summary?'+new URLSearchParams(applied)).then(r=>r.json())]);
 if(generation!==state.generation||!state.token)return;state.appliedFilters=applied;render(report);$('applied-range').textContent=CONFIG.dated.includes(applied.sort_report)?copy('appliedRange',{start:applied.start.replace('T',' '),end:applied.end.replace('T',' ')}):copy('currentConfig');for(const key of ['claims','points','scans','duplicates'])$('metric-'+key).textContent=number.format(summary[key]);status(copy(CONFIG.dated.includes(applied.sort_report)?'reportUpdated':'reportReady'));
 }catch(error){state.appliedFilters=null;state.appliedColumns=[];state.page=1;state.pages=1;$('thead').replaceChildren();$('page-info').textContent='';$('empty').hidden=true;$('applied-range').textContent='';if(state.token){$('table-error').textContent=error.message;$('table-feedback').hidden=false;}$('tbody').replaceChildren();$('count').textContent=copy('dash');for(const key of ['claims','points','scans','duplicates'])$('metric-'+key).textContent=copy('dash');status(error.message,true);}
 finally{busy(false);datasetControls();}
}
async function initialize(){const meta=await (await api('/meta')).json();state.meta=meta;$('start').value=meta.start;$('end').value=meta.end;refreshDateLabels();$('shop').replaceChildren(option('',copy('all')),...meta.shops.map(s=>option(s.shop_code,s.shop_code+' · '+s.name)));$('result').replaceChildren(option('',copy('all')),...meta.statuses.map(s=>option(s,CONFIG.statuses[s]||s)));$('timezone').textContent=copy('timezone',{zone:meta.timezone});$('login-panel').hidden=true;$('dashboard').hidden=false;$('logout').hidden=false;$('password').value='';datasetControls();}
document.getElementById('login-form').addEventListener('submit',async event=>{event.preventDefault();if(state.busy)return;for(const id of ['username','password'])$(id).setAttribute('aria-invalid',String(!$(id).value));if(!$('username').value||!$('password').value){status(copy('required'),true);(!$('username').value?$('username'):$('password')).focus();return;}busy(true);status(copy('loading'));try{const result=await (await api('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})})).json();state.token=result.token;await initialize();}catch(error){status(error.message,true);}finally{busy(false);}if(state.token&&!$('dashboard').hidden){await load();if(state.token)$('report-title').focus();}});
document.getElementById('logout').addEventListener('click',async()=>{if(state.busy)return;busy(true);let failed=false;try{await api('/logout',{method:'POST'});}catch{failed=true;}finally{lock(copy(failed?'logoutOffline':'loggedOut'));status(copy(failed?'logoutOffline':'loggedOut'),failed);busy(false);}});
document.getElementById('toggle-password').addEventListener('click',()=>{const shown=$('password').type==='password';$('password').type=shown?'text':'password';$('toggle-password').textContent=copy(shown?'hidePassword':'showPassword');$('toggle-password').setAttribute('aria-pressed',String(shown));});
document.getElementById('filter-form').addEventListener('submit',event=>{event.preventDefault();state.page=1;load();});
document.getElementById('kind').addEventListener('change',()=>{state.sort='';state.direction='asc';datasetControls();state.page=1;load();});
document.getElementById('bill').addEventListener('input',()=>{$('clear-search').hidden=!$('bill').value;});
document.getElementById('clear-search').addEventListener('click',()=>{$('bill').value='';$('clear-search').hidden=true;$('bill').focus();state.page=1;load();});
for(const id of ['shop','result'])$(id).addEventListener('change',async()=>{state.page=1;await load();if(state.token&&!$(id).disabled)$(id).focus();});
$('clear-filters').addEventListener('click',async()=>{
 if(state.busy||!state.token)return;busy(true);status(copy('loading'));
 try{
  const meta=await (await api('/meta')).json();state.meta=meta;
  $('start').value=meta.start;$('end').value=meta.end;
  for(const id of ['shop','bill','result'])$(id).value='';
  $('clear-search').hidden=true;state.page=1;state.sort='';state.direction='asc';refreshDateLabels();
 }catch(error){status(error.message,true);return;}
 finally{busy(false);datasetControls();if(state.token&&!$('clear-filters').disabled)$('clear-filters').focus();}
 await load();if(state.token&&state.appliedFilters)status(copy('filtersReset'));
 if(state.token&&!$('clear-filters').disabled)$('clear-filters').focus();
});
document.getElementById('prev').addEventListener('click',()=>{state.page--;load();});document.getElementById('next').addEventListener('click',()=>{state.page++;load();});
function exportMessage(message='',error=false){$('export-error').textContent=message;$('export-error').dataset.error=String(error);}
function openExport(){
 if(state.busy||!state.token)return;if(!state.appliedFilters){status(copy('reportRequired'),true);return;}
 $('export-summary').checked=true;exportMessage();
 $('export-range').textContent=CONFIG.datasets[state.appliedFilters.sort_report]+' · '+$('applied-range').textContent;
 $('export-summary-hint').textContent=copy('exportSummaryHint',{columns:number.format(state.appliedColumns.length)});
 $('export-detail-hint').textContent=copy('exportDetailHint',{reports:number.format(Object.keys(CONFIG.datasets).length)});
 $('export-dialog').showModal();$('export-summary').focus();
}
function summaryPayload(){
 const columns=state.appliedColumns;
 return {report:state.appliedFilters.sort_report,filters:{...state.appliedFilters},columns:columns.map(key=>({key,label:CONFIG.columns[key]||copy('unknownColumn')})),presentation:{
  empty:copy('dash'),lineMissing:copy('lineMissing'),lineProfileMissing:copy('lineProfileMissing'),deviceMissing:copy('deviceMissing'),deviceUnknown:copy('deviceUnknown'),profileNameField:CONFIG.profileFields.name,deviceRules:CONFIG.deviceRules,
  statuses:columns.includes('result')?CONFIG.statuses:{},rewardStates:columns.includes('reward_received')?CONFIG.rewardStates:{},timestamps:CONFIG.timestamps.filter(key=>columns.includes(key))
 }};
}
async function exportReport(event){
 event.preventDefault();if(state.busy||!state.token||!state.appliedFilters)return;
 const detail=$('export-detail').checked,format=CONFIG.exportFormat;let complete=false;
 busy(true);$('export-dialog').setAttribute('aria-busy','true');exportMessage(copy('exporting'));status(copy('exporting'));
 try{
  const filename=CONFIG.exportFilename.prefix+[state.appliedFilters.start,state.appliedFilters.end].map(value=>value.replace(CONFIG.exportFilename.datePattern,CONFIG.exportFilename.dateReplacement)).join('')+'.'+format;
  const response=detail?await api(CONFIG.exportAllPath+'?'+params({format},true)):await api(CONFIG.exportSummaryPath,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(summaryPayload())});
  const blob=await response.blob();if(!state.token)return;
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),CONFIG.timeoutMs);
  complete=true;status(copy('saved'));
 }catch(error){if(state.token){exportMessage(error.message,true);status(error.message,true);}}
 finally{busy(false);datasetControls();$('export-dialog').setAttribute('aria-busy','false');if(complete){$('export-dialog').close();}else if(state.token&&$('export-dialog').open){$('export-confirm').focus();}}
}
$('export-open').addEventListener('click',openExport);
$('export-form').addEventListener('submit',exportReport);
$('export-cancel').addEventListener('click',()=>{if(!state.busy)$('export-dialog').close();});
$('export-dialog').addEventListener('cancel',event=>{if(state.busy)event.preventDefault();});
$('export-dialog').addEventListener('close',()=>{exportMessage();if(state.token&&!$('export-open').disabled)$('export-open').focus();});
for(const key of ['start','end'])$(key+'-picker').addEventListener('click',()=>openDate(key));
$('date-form').addEventListener('submit',confirmDate);
$('date-cancel').addEventListener('click',()=>$('date-dialog').close());
$('date-dialog').addEventListener('close',()=>{const draft=state.dateDraft;state.dateDraft=null;if(state.token&&draft?.trigger.isConnected&&!draft.trigger.disabled)draft.trigger.focus();});
$('date-calendar').addEventListener('change',clearDateError);
for(const unit of CONFIG.calendar.units){const input=$('date-'+unit.key);input.min=CONFIG.calendar.timeMin;input.max=unit.max;input.step=CONFIG.calendar.timeStep;input.addEventListener('input',clearDateError);}
document.getElementById('report-retry').addEventListener('click',()=>load());
document.getElementById('device-close').addEventListener('click',()=>$('device-dialog').close());
document.getElementById('device-dialog').addEventListener('close',()=>{const trigger=state.deviceTrigger;state.deviceTrigger=null;$('device-value').textContent='';$('device-title').textContent='';if(trigger?.isConnected)trigger.focus();});
document.querySelectorAll('[data-copy]').forEach(el=>el.textContent=copy(el.dataset.copy));$('kind').replaceChildren(...Object.entries(CONFIG.datasets).map(([key,label])=>option(key,label)));$('caption').textContent=copy('caption');$('metrics').setAttribute('aria-label',copy('summaryNote'));
$('clear-filters').title=copy('clearFiltersHint');
document.querySelectorAll('[data-icon]').forEach(el=>el.style.setProperty('--icon-url','url("'+CONFIG.icons[el.dataset.icon]+'")'));
document.querySelectorAll('[data-button-icon]').forEach(el=>el.prepend(localIcon(el.dataset.buttonIcon)));
const font=document.createElement('link');font.rel='stylesheet';font.href=CONFIG.fontUrl;document.head.append(font);
</script>
</body>
