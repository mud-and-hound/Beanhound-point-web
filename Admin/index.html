.insights strong{display:block;font-size:var(--subheading);font-weight:500;color:var(--ink)}
.insights span{color:var(--muted)}
.chart{position:relative;min-height:var(--chart-height)}
.chart svg{display:block;width:100%;height:var(--chart-height);overflow:visible}
.chart .grid{stroke:var(--chart-grid);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--chart)}
.chart .bar.peak{fill:var(--accent)}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .bar.on{fill:var(--accent)}
.chart text{font:var(--small) var(--font);fill:var(--muted);font-variant-numeric:tabular-nums}
.chart text.peak-label{fill:var(--ink);font-weight:500}
.bars{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.bars li{display:grid;grid-template-columns:minmax(90px,38%) minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.bar-label{overflow-wrap:anywhere;color:var(--ink)}
.bar-track{height:var(--bar-thick);background:transparent;position:relative}
.bar-fill{position:absolute;inset:0 auto 0 0;width:var(--w);min-width:2px;background:var(--chart);border-radius:0 4px 4px 0}
.bar-value{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.bar-sub{grid-column:1/-1;margin-top:-4px;color:var(--muted);font-size:var(--small)}
.table-view{margin-top:var(--gap)}
.table-view summary{cursor:pointer;color:var(--accent);font-size:var(--small);width:max-content}
.table-view table{margin-top:8px;border-collapse:collapse;width:100%;font-size:var(--small)}
.table-view td,.table-view th{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left}
.table-view td:last-child,.table-view th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.empty-state{padding:var(--space);text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:var(--radius)}
.crm-section{margin-bottom:var(--panel-pad)}
.crm-section>.report-head{border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:var(--panel-pad);border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--pill);border:1px solid var(--line);background:var(--paper);font-size:var(--small);white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.good::before{background:var(--good)}.chip.warning::before{background:var(--warn)}.chip.critical::before{background:var(--bad)}.chip.info::before{background:var(--scroll)}
.chip strong{font-weight:600}
button.chip{min-height:0;color:var(--ink)}
button.chip[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.flags{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.crm-kpi-sub{display:block;grid-column:1/-1;color:var(--muted);font-size:var(--small)}
#crm-tip{position:fixed;z-index:20;pointer-events:none;padding:8px 10px;background:var(--ink);color:var(--paper);border-radius:var(--control-radius);font-size:var(--small);max-width:260px;box-shadow:0 6px 18px #0002}
#crm-tip strong{display:block;font-size:var(--subheading);font-weight:600}
#crm-error{padding:var(--space);text-align:center}
/* ── Inbox ── */
.inbox-list{list-style:none;margin:0;padding:0;display:grid;gap:var(--gap)}
.fb-card{display:grid;gap:8px;padding:var(--panel-pad);background:var(--paper);border:1px solid var(--line);border-radius:var(--radius)}
.fb-card[data-status=new]{border-left:3px solid var(--accent)}
.fb-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.fb-head h2{margin:0;font-size:var(--subheading);font-weight:500;flex:1;min-width:200px}
.fb-detail{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.fb-meta{font-size:var(--small);color:var(--muted)}
.fb-status{display:flex;align-items:center;gap:8px}.fb-status select{width:auto}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.thumbs button{padding:0;width:96px;height:72px;overflow:hidden;background:var(--soft);border-color:var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.badge.fix{background:#fdecea;color:#8a1c14}.badge.adjust{background:#fff6dc;color:#6b4e00}.badge.add{background:#e6f7ec;color:#006300}
/* ── Feedback & annotate dialogs ── */
#feedback-dialog{width:min(640px,calc(100% - var(--space)))}
#feedback-form{display:grid;gap:var(--gap)}
#feedback-form textarea{width:100%;min-height:120px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--control-radius);font:inherit;resize:vertical;background:var(--paper)}
.kind-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border:0;padding:0;margin:0;min-width:0}
.kind-options legend{padding:0;margin-bottom:6px;font-size:var(--small);color:var(--muted)}
.kind-options label{display:flex;flex-direction:column;gap:2px;margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:var(--control-radius);cursor:pointer;color:var(--ink)}
.kind-options label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.kind-options label:has(input:focus-visible){outline:var(--focus) solid var(--accent);outline-offset:2px}
.kind-options input{position:absolute;opacity:0;width:1px;height:1px}
.kind-options strong{font-size:var(--subheading);font-weight:500}
.kind-options small{color:var(--muted);font-size:var(--small)}
.attach-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.attach-actions p{font-size:var(--small)}
.attach-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.attach-list li{display:grid;gap:6px;padding:6px;border:1px solid var(--line);border-radius:var(--control-radius);background:var(--soft)}
.attach-list img{width:100%;height:96px;object-fit:cover;border-radius:6px;background:var(--paper)}
.attach-list div{display:flex;gap:6px}.attach-list button{flex:1;padding:4px 8px;min-height:32px}
#feedback-message{min-height:1.6em;font-size:var(--small);color:var(--muted)}
#feedback-message[data-error=true]{color:var(--danger)}
#annotate-dialog{width:min(1100px,calc(100% - var(--space)));padding:var(--panel-pad)}
.annotate-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:var(--gap)}
.annotate-tools button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.swatch{width:var(--control);padding:0}
.swatch span{width:18px;height:18px;border-radius:50%;background:var(--swatch);box-shadow:0 0 0 1px #0003}
.tool-sep{width:1px;height:24px;background:var(--line)}
.canvas-wrap{max-height:70vh;overflow:auto;background:var(--soft);border:1px solid var(--line);border-radius:var(--control-radius);display:grid;place-items:center}
#annotate-canvas{max-width:100%;height:auto;touch-action:none;cursor:crosshair;display:block}
#image-dialog{width:min(1100px,calc(100% - var(--space)))}
#image-view{max-width:100%;height:auto;display:block;margin:auto}
@media(max-width:850px){.crm-upload,.crm-grid{grid-template-columns:1fr}.kind-options{grid-template-columns:1fr}}
@media(max-width:500px){.views{width:100%}.view-tab{flex:1 1 auto;padding:8px 10px}.header-actions{width:100%;justify-content:stretch}.header-actions button{flex:1}}
</style>
</head>
<body>
<header><div class="brand-lockup"><span class="brand-stamp"><span class="mascot" data-icon="hound" aria-hidden="true"></span></span><div><div class="brand" data-copy="brand"></div><div class="byline" data-copy="byline"></div></div></div><div class="header-actions"><button id="feedback-open" type="button" class="secondary" data-copy="feedbackOpen" data-button-icon="feedback" aria-haspopup="dialog" aria-controls="feedback-dialog" hidden></button><button id="logout" class="secondary" data-copy="logout" data-button-icon="logout" hidden></button></div></header>

  <div><label for="end-picker" data-copy="end"></label><input type="hidden" id="end"><button type="button" id="end-picker" class="secondary date-trigger" aria-haspopup="dialog" aria-controls="date-dialog" aria-describedby="status"><span id="end-label"></span><span class="icon" data-icon="calendar" aria-hidden="true"></span></button></div>
  <div><label for="shop" data-copy="shop"></label><select id="shop"></select></div>

  <div><label for="result" data-copy="result"></label><select id="result"></select></div>
  <div class="filter-actions"><button type="button" id="clear-filters" class="secondary" data-copy="clearFilters" data-button-icon="repeat"></button></div>

 </form>
 <section class="report" aria-labelledby="table-title">
  <div class="report-head"><div class="report-heading"><span class="icon" data-icon="receipt" aria-hidden="true"></span><div><h2 id="table-title"></h2><p id="count"></p></div></div><div class="export-actions"><div class="page-size"><label for="page-size" data-copy="pageSize"></label><select id="page-size" aria-describedby="page-size-unit"></select><span id="page-size-unit" data-copy="pageSizeUnit"></span></div><button id="export-open" data-copy="exportOpen" data-button-icon="download" aria-haspopup="dialog" aria-controls="export-dialog" disabled></button></div></div>
  <p id="applied-range"></p><div id="table-feedback" hidden><p id="table-error" role="status"></p><button id="report-retry" type="button" data-copy="retry"></button></div><div class="table-scroll" tabindex="0" role="region" aria-labelledby="caption"><table><caption id="caption"></caption><thead id="thead"></thead><tbody id="tbody"></tbody></table><p id="empty" data-copy="empty" hidden></p></div>
  <div class="pagination"><p id="page-info"></p><div><button id="prev" class="secondary" data-copy="prev" data-button-icon="previous"></button><button id="next" class="secondary" data-copy="next" data-button-icon="next"></button></div></div>
 </section>
 <footer data-copy="footer"></footer>
</section>
<section id="crm" data-view hidden aria-labelledby="crm-title">
 <div class="topline"><div><p class="eyebrow" data-copy="crmEyebrow"></p><h1 tabindex="-1" id="crm-title" data-copy="crmTitle"></h1><p data-copy="crmIntro"></p></div></div>

  <div class="panel"><h2><span class="icon" data-icon="checklist" aria-hidden="true"></span><span data-copy="uploadsTitle"></span></h2><p class="panel-note" data-copy="uploadsNote"></p><ul class="upload-list" id="crm-uploads"></ul></div>
 </div>

 <div id="image-holder"></div>

<div id="crm-tip" hidden aria-hidden="true"></div>
<script id="app-config">
const CONFIG = {
 calendar:{script:'./vendor/cally.js',locale:'th-TH-u-ca-gregory',firstDayOfWeek:0,formatWeekday:'short',digits:2,timeMin:0,timeStep:1,units:[{key:'hour',max:23},{key:'minute',max:59},{key:'second',max:59}],displayOptions:{calendar:'gregory',year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}},

 icons:{hound:'icons/hound.svg',receipt:'icons/receipt.svg',beans:'icons/beans.svg',scan:'icons/scan.svg',repeat:'icons/repeat.svg',download:'icons/download.svg',phone:'icons/phone.svg',profile:'icons/profile.svg',search:'icons/search.svg',calendar:'icons/calendar.svg',logout:'icons/logout.svg',previous:'icons/previous.svg',next:'icons/next.svg',sortAsc:'icons/sort-asc.svg',sortDesc:'icons/sort-desc.svg'},
 rowNumber:'row_number',
 claimColumns:['shop_code','shop_name','bill_no','bill_date','amount_net','points','reward_received','reward_clicked_at','tier_amount','line_user_id','user_agent','created_at'],
 profileFields:{name:'line_display_name',picture:'line_picture_url'},profileProtocols:['https:'],
 deviceRules:[{tokens:['iPad'],label:'iPad'},{tokens:['iPhone'],label:'iPhone'},{tokens:['Android'],label:'Android'},{tokens:['Windows'],label:'Windows'},{tokens:['Macintosh','Mac OS'],label:'Mac'},{tokens:['Linux'],label:'Linux'}],
 cellPreviewChars:60, sortDirections:{asc:'ascending',desc:'descending'},sortIcons:{none:'sortAsc',asc:'sortAsc',desc:'sortDesc'},
 API_URL:'https://beanhoundscan.mobile1234.site', prefix:'/api/admin', fontUrl:'fonts/prompt.css',
 locale:'th-TH', timezone:'Asia/Bangkok', offset:'+07:00', timeoutMs:30000, searchDelayMs:300, dateStep:1,

});

<script id="app-main">
'use strict';
const $=id=>document.getElementById(id);
const state={token:null,page:1,pages:1,busy:false,meta:null,controller:null,generation:0,appliedFilters:null,appliedColumns:[],deviceTrigger:null,dateDraft:null,sort:'',direction:'asc',pageSize:null};
const number=new Intl.NumberFormat(CONFIG.locale,CONFIG.numberOptions);
const dates=new Intl.DateTimeFormat(CONFIG.locale,CONFIG.dateOptions);
const dateLabels=new Intl.DateTimeFormat(CONFIG.locale,{...CONFIG.calendar.displayOptions,timeZone:CONFIG.timezone});
const calendarReady=import(CONFIG.calendar.script).then(()=>true,()=>false);
const copy=(key,values={})=>Object.entries(values).reduce((s,[k,v])=>s.replaceAll('{'+k+'}',v),CONFIG.messages[key]);
function status(message='',error=false){$('status').textContent=message;$('status').dataset.error=String(error);}
function busy(value){state.busy=value;document.querySelectorAll('button,input,select').forEach(el=>el.disabled=value);$('prev').disabled=value||state.page<=1;$('next').disabled=value||state.page>=state.pages;$('export-open').disabled=value||!state.appliedFilters;$('dashboard').setAttribute('aria-busy',String(value));}
function lock(message){state.generation++;state.token=null;state.meta=null;state.appliedFilters=null;state.appliedColumns=[];if($('export-dialog').open)$('export-dialog').close();if($('date-dialog').open)$('date-dialog').close();if($('device-dialog').open)$('device-dialog').close();$('device-value').textContent='';$('device-title').textContent='';$('table-feedback').hidden=true;$('applied-range').textContent='';for(const key of ['claims','points','scans','duplicates'])$('metric-'+key).textContent=copy('dash');$('count').textContent='';$('page-info').textContent='';$('password').type='password';$('toggle-password').textContent=copy('showPassword');$('toggle-password').setAttribute('aria-pressed','false');$('password').value='';$('tbody').replaceChildren();$('thead').replaceChildren();$('dashboard').hidden=true;$('login-panel').hidden=false;$('logout').hidden=true;status(message,true);$('username').disabled=false;if(typeof crmLock==='function')crmLock();$('username').focus();}
async function api(path,options={}){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),CONFIG.timeoutMs);
 const requestToken=state.token;const headers={...(requestToken?{Authorization:'Bearer '+requestToken}:{}),...options.headers};
 try{
  const response=await fetch(CONFIG.API_URL+CONFIG.prefix+path,{...options,headers,signal:controller.signal,cache:'no-store',credentials:'omit'});
  if(!response.ok){let body;try{body=await response.json();}catch{}if(response.status===CONFIG.unauthorizedStatus&&requestToken&&state.token===requestToken)lock(copy('session'));throw new Error(typeof body?.detail==='string'?body.detail:copy('error'));}
  return response;
 }finally{clearTimeout(timer);}
}
function filters(){return {start:$('start').value,end:$('end').value,shop:$('shop').value,bill:$('bill').value.trim(),status:$('result').value,sort:state.sort,direction:state.direction,sort_report:$('kind').value};}
function params(extra={},committed=false){return new URLSearchParams({...committed?state.appliedFilters:filters(),...extra});}
function refreshDateLabels(){for(const key of ['start','end'])$(key+'-label').textContent=$(key).value?dateLabels.format(new Date($(key).value+CONFIG.offset)):copy('dash');}
function dateMessage(message,error=false){$('date-message').textContent=message;$('date-message').dataset.error=String(error);}
function clearDateError(){$('date-calendar').removeAttribute('aria-invalid');for(const unit of CONFIG.calendar.units)$('date-'+unit.key).removeAttribute('aria-invalid');dateMessage(copy('datePending'));}
async function openDate(target){
 if(state.busy||!state.token)return;
 if(!await calendarReady){status(copy('dateUnavailable'),true);return;}
 if(state.busy||!state.token||$('date-dialog').open)return;
 const [day,time]=$(target).value.split('T'),parts=time.split(':');
 state.dateDraft={target,trigger:$(target+'-picker')};
 const calendar=$('date-calendar');calendar.locale=CONFIG.calendar.locale;calendar.firstDayOfWeek=CONFIG.calendar.firstDayOfWeek;calendar.formatWeekday=CONFIG.calendar.formatWeekday;calendar.today=state.meta.start.split('T')[0];calendar.value=day;calendar.focusedDate=day;calendar.getDayParts=date=>'date-'+date.toISOString().split('T')[0];
 CONFIG.calendar.units.forEach((unit,index)=>{$('date-'+unit.key).value=parts[index]||String(CONFIG.calendar.timeMin).padStart(CONFIG.calendar.digits,'0');});
 $('date-title').textContent=copy(target);clearDateError();$('date-dialog').showModal();
 await calendar.updated;await calendar.querySelector('calendar-month').updated;
 if($('date-dialog').open)calendar.focus();
}
async function confirmDate(event){
 event.preventDefault();if(state.busy||!state.dateDraft)return;
 const inputs=CONFIG.calendar.units.map(unit=>$('date-'+unit.key));const invalid=inputs.find(input=>input.value===''||!input.validity.valid);
 if(invalid){dateMessage(copy('dateInvalidTime'),true);invalid.setAttribute('aria-invalid','true');invalid.focus();return;}
 const draft=state.dateDraft;const value=$('date-calendar').value+'T'+inputs.map(input=>String(Number(input.value)).padStart(CONFIG.calendar.digits,'0')).join(':');
 const start=draft.target==='start'?value:$('start').value,end=draft.target==='end'?value:$('end').value;
 if(!Number.isFinite(new Date(value+CONFIG.offset).valueOf())||new Date(start+CONFIG.offset)>new Date(end+CONFIG.offset)){
  dateMessage(copy('invalidRange'),true);$('date-calendar').setAttribute('aria-invalid','true');$('date-calendar').focus();return;
 }
 $(draft.target).value=value;refreshDateLabels();$('date-dialog').close();state.page=1;await load();
 if(state.token&&draft.trigger.isConnected&&!draft.trigger.disabled)draft.trigger.focus();
}
function option(value,label){const el=document.createElement('option');el.value=value;el.textContent=label;return el;}
function fieldValue(key,value,row={}){
 if(value===null||value===undefined||value==='')return copy('dash');
 if(key==='reward_received')return CONFIG.rewardStates[Number(value)===1&&!row.reward_clicked_at?'legacy':value]||String(value);
 if(key==='result')return CONFIG.statuses[value]||value;
 if(CONFIG.numeric.includes(key))return number.format(Number(value));
 if(CONFIG.timestamps.includes(key)){const date=new Date(String(value).replace(' ','T')+CONFIG.offset);if(!Number.isNaN(date.valueOf()))return dates.format(date);}
 return typeof value==='object'?JSON.stringify(value):String(value);
}
function localIcon(name,className='icon'){const icon=document.createElement('span');icon.className=className;icon.setAttribute('aria-hidden','true');icon.dataset.icon=name;icon.style.setProperty('--icon-url','url("'+CONFIG.icons[name]+'")');return icon;}
function renderProfile(td,row){
 td.className='profile-cell';const person=document.createElement('div');person.className='profile-person';
 const avatar=document.createElement('img'),name=document.createElement('span');avatar.className='profile-avatar';avatar.alt='';avatar.src=CONFIG.icons.profile;name.className='profile-name';
 const id=row.line_user_id;const displayName=id&&row[CONFIG.profileFields.name];name.textContent=displayName||(id?copy('lineProfileMissing'):copy('lineMissing'));if(!displayName)name.classList.add('profile-note');
 if(id&&row[CONFIG.profileFields.picture]){try{const url=new URL(row[CONFIG.profileFields.picture]);if(CONFIG.profileProtocols.includes(url.protocol)){avatar.referrerPolicy='no-referrer';avatar.addEventListener('error',()=>{avatar.src=CONFIG.icons.profile;},{once:true});avatar.src=url.href;}}catch{}}
 person.append(avatar,name);td.append(person);
 if(id){const detail=document.createElement('details'),summary=document.createElement('summary'),value=document.createElement('div');detail.className='cell-detail profile-detail';summary.textContent=copy('lineDetail');value.className='cell-value';value.textContent=copy('lineId')+': '+String(id);detail.append(summary,value);td.append(detail);}
}
function renderDevice(td,value){
 if(!value){td.textContent=copy('deviceMissing');return;}
 const button=document.createElement('button');button.type='button';button.className='secondary device-button';button.setAttribute('aria-label',copy('deviceDetail'));button.title=copy('deviceDetail');button.append(localIcon('phone'));
 button.addEventListener('click',()=>{state.deviceTrigger=button;$('device-title').textContent=CONFIG.deviceRules.find(rule=>rule.tokens.some(token=>String(value).toLowerCase().includes(token.toLowerCase())))?.label||copy('deviceUnknown');$('device-value').textContent=String(value);$('device-dialog').showModal();});td.append(button);
}
function render(data){
 state.page=data.page;state.pages=data.pages;$('table-title').textContent=CONFIG.datasets[$('kind').value];$('count').textContent=copy('records',{count:number.format(data.total)});
 $('page-info').textContent=copy('page',{page:number.format(data.page),pages:number.format(data.pages)});$('thead').replaceChildren();$('tbody').replaceChildren();$('empty').hidden=data.total!==0;
 const columns=[CONFIG.rowNumber,...($('kind').value==='claims'?CONFIG.claimColumns.filter(key=>data.columns.includes(key)):data.columns)];state.appliedColumns=[...columns];const head=document.createElement('tr');
 // The row number counts rows as shown, continuing across pages; it has no database column to sort.
 const first=(data.page-1)*(data.page_size||0);
 for(const key of columns){const th=document.createElement('th');th.scope='col';if(key===CONFIG.rowNumber){th.className='row-number';th.textContent=CONFIG.columns[key];head.append(th);continue;}const button=document.createElement('button');button.type='button';button.className='sort-button';button.dataset.sort=key;const label=CONFIG.columns[key]||copy('unknownColumn');button.textContent=label;const active=state.sort===key;const next=active&&state.direction==='asc'?'desc':'asc';button.setAttribute('aria-label',copy('sortHint',{column:label,direction:copy(next)}));th.setAttribute('aria-sort',active?CONFIG.sortDirections[state.direction]:'none');const arrow=localIcon(CONFIG.sortIcons[active?state.direction:'none'],'icon sort-arrow');button.append(arrow);button.addEventListener('click',()=>{if(state.busy)return;state.sort=key;state.direction=next;state.page=1;load().then(()=>{Array.from(document.querySelectorAll('.sort-button')).find(el=>el.dataset.sort===key)?.focus({preventScroll:true});});});th.append(button);head.append(th);}$('thead').append(head);
 for(const [index,row] of data.rows.entries()){const tr=document.createElement('tr');for(const key of columns){const td=document.createElement('td');if(key===CONFIG.rowNumber){const content=document.createElement('div');content.className='cell-value cell-short';content.textContent=number.format(first+index+1);td.className='number';td.append(content);tr.append(td);continue;}if(key==='line_user_id'){renderProfile(td,row);tr.append(td);continue;}if(key==='user_agent'){renderDevice(td,row[key]);tr.append(td);continue;}const value=fieldValue(key,row[key],row);const content=document.createElement('div');content.className='cell-value';content.textContent=value;
if(value.length>CONFIG.cellPreviewChars||value.includes('\n')){const detail=document.createElement('details'),summary=document.createElement('summary');detail.className='cell-detail';summary.textContent=copy('detail');const preview=document.createElement('div');preview.className='cell-value';preview.textContent=value.slice(0,CONFIG.cellPreviewChars)+copy('ellipsis');td.append(preview);detail.append(summary,content);detail.addEventListener('toggle',()=>{preview.hidden=detail.open;summary.textContent=copy(detail.open?'collapse':'detail');});td.append(detail);}else{content.classList.add('cell-short');td.append(content);}if(CONFIG.numeric.includes(key))td.className='number';tr.append(td);}$('tbody').append(tr);}

}
function datasetControls(){const dated=CONFIG.dated.includes($('kind').value);for(const id of ['start','end','start-picker','end-picker','shop','bill','search-bill','clear-search','clear-filters'])$(id).disabled=!dated;$('result').disabled=$('kind').value!=='attempts';$('filter-note').textContent=copy(dated?'rangeNote':'configNote');}
function validate(){const valid=Boolean($('start').value&&$('end').value&&$('start').value<=$('end').value);for(const id of ['start-picker','end-picker'])$(id).setAttribute('aria-invalid',String(!valid));if(!valid){status(copy('invalidRange'),true);$('start-picker').focus();}return valid;}
async function load(){
 if(state.busy||!state.token||!validate())return;const generation=++state.generation;const applied=filters();busy(true);$('table-feedback').hidden=true;status(copy('loading'));
 try{const query=new URLSearchParams({...applied,page:state.page,...(state.pageSize?{page_size:state.pageSize}:{})});const [report,summary]=await Promise.all([api('/reports/'+$('kind').value+'?'+query).then(r=>r.json()),api('/summary?'+new URLSearchParams(applied)).then(r=>r.json())]);
 if(generation!==state.generation||!state.token)return;state.appliedFilters=applied;render(report);$('applied-range').textContent=CONFIG.dated.includes(applied.sort_report)?copy('appliedRange',{start:applied.start.replace('T',' '),end:applied.end.replace('T',' ')}):copy('currentConfig');for(const key of ['claims','points','scans','duplicates'])$('metric-'+key).textContent=number.format(summary[key]);status(copy(CONFIG.dated.includes(applied.sort_report)?'reportUpdated':'reportReady'));
 }catch(error){state.appliedFilters=null;state.appliedColumns=[];state.page=1;state.pages=1;$('thead').replaceChildren();$('page-info').textContent='';$('empty').hidden=true;$('applied-range').textContent='';if(state.token){$('table-error').textContent=error.message;$('table-feedback').hidden=false;}$('tbody').replaceChildren();$('count').textContent=copy('dash');for(const key of ['claims','points','scans','duplicates'])$('metric-'+key).textContent=copy('dash');status(error.message,true);}
 finally{busy(false);datasetControls();}
}
// Choices come from the server allowlist; a non-numeric choice is the show-all option.
function pageSizes(meta){const choices=(meta.page_sizes||[meta.page_size]).map(String);$('page-size').replaceChildren(...choices.map(value=>option(value,Number.isFinite(Number(value))?number.format(Number(value)):copy('all'))));if(!choices.includes(state.pageSize))state.pageSize=String(meta.page_size);$('page-size').value=state.pageSize;}
async function initialize(){const meta=await (await api('/meta')).json();state.meta=meta;$('start').value=meta.start;$('end').value=meta.end;refreshDateLabels();$('shop').replaceChildren(option('',copy('all')),...meta.shops.map(s=>option(s.shop_code,s.shop_code+' · '+s.name)));$('result').replaceChildren(option('',copy('all')),...meta.statuses.map(s=>option(s,CONFIG.statuses[s]||s)));$('timezone').textContent=copy('timezone',{zone:meta.timezone});pageSizes(meta);$('login-panel').hidden=true;$('dashboard').hidden=false;$('logout').hidden=false;$('password').value='';datasetControls();if(typeof crmReady==='function')crmReady();}
document.getElementById('login-form').addEventListener('submit',async event=>{event.preventDefault();if(state.busy)return;for(const id of ['username','password'])$(id).setAttribute('aria-invalid',String(!$(id).value));if(!$('username').value||!$('password').value){status(copy('required'),true);(!$('username').value?$('username'):$('password')).focus();return;}busy(true);status(copy('loading'));try{const result=await (await api('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})})).json();state.token=result.token;await initialize();}catch(error){status(error.message,true);}finally{busy(false);}if(state.token&&!$('dashboard').hidden){await load();if(state.token)$('report-title').focus();}});
document.getElementById('logout').addEventListener('click',async()=>{if(state.busy)return;busy(true);let failed=false;try{await api('/logout',{method:'POST'});}catch{failed=true;}finally{lock(copy(failed?'logoutOffline':'loggedOut'));status(copy(failed?'logoutOffline':'loggedOut'),failed);busy(false);}});
document.getElementById('toggle-password').addEventListener('click',()=>{const shown=$('password').type==='password';$('password').type=shown?'text':'password';$('toggle-password').textContent=copy(shown?'hidePassword':'showPassword');$('toggle-password').setAttribute('aria-pressed',String(shown));});
document.getElementById('filter-form').addEventListener('submit',event=>{event.preventDefault();state.page=1;load();});
document.getElementById('kind').addEventListener('change',()=>{state.sort='';state.direction='asc';datasetControls();state.page=1;load();});
document.getElementById('bill').addEventListener('input',()=>{$('clear-search').hidden=!$('bill').value;});
document.getElementById('clear-search').addEventListener('click',()=>{$('bill').value='';$('clear-search').hidden=true;$('bill').focus();state.page=1;load();});
$('page-size').addEventListener('change',async()=>{state.pageSize=$('page-size').value;state.page=1;await load();if(state.token&&!$('page-size').disabled)$('page-size').focus();});
for(const id of ['shop','result'])$(id).addEventListener('change',async()=>{state.page=1;await load();if(state.token&&!$(id).disabled)$(id).focus();});
$('clear-filters').addEventListener('click',async()=>{
 if(state.busy||!state.token)return;busy(true);status(copy('loading'));
 try{
  const meta=await (await api('/meta')).json();state.meta=meta;
  $('start').value=meta.start;$('end').value=meta.end;
  for(const id of ['shop','bill','result'])$(id).value='';
  $('clear-search').hidden=true;state.page=1;state.sort='';state.direction='asc';refreshDateLabels();
 }catch(error){status(error.message,true);return;}
 finally{busy(false);datasetControls();if(state.token&&!$('clear-filters').disabled)$('clear-filters').focus();}
 await load();if(state.token&&state.appliedFilters)status(copy('filtersReset'));
 if(state.token&&!$('clear-filters').disabled)$('clear-filters').focus();
});
document.getElementById('prev').addEventListener('click',()=>{state.page--;load();});document.getElementById('next').addEventListener('click',()=>{state.page++;load();});
function exportMessage(message='',error=false){$('export-error').textContent=message;$('export-error').dataset.error=String(error);}
function openExport(){
 if(state.busy||!state.token)return;if(!state.appliedFilters){status(copy('reportRequired'),true);return;}
 $('export-summary').checked=true;exportMessage();
 $('export-range').textContent=CONFIG.datasets[state.appliedFilters.sort_report]+' · '+$('applied-range').textContent;
 $('export-summary-hint').textContent=copy('exportSummaryHint',{columns:number.format(state.appliedColumns.length)});
 $('export-detail-hint').textContent=copy('exportDetailHint',{reports:number.format(Object.keys(CONFIG.datasets).length)});
 $('export-dialog').showModal();$('export-summary').focus();
}
function summaryPayload(){
 const columns=state.appliedColumns;
 return {report:state.appliedFilters.sort_report,filters:{...state.appliedFilters},columns:columns.map(key=>({key,label:CONFIG.columns[key]||copy('unknownColumn')})),presentation:{

// ── Workspace switching ────────────────────────────────────────────────────

// ── CRM data ───────────────────────────────────────────────────────────────
async function crmStart(){

 try{await loadMeta();}catch(error){showCrmError(error);busy(false);return;}

}
async function loadMeta(){

}

 $('crm-shop').replaceChildren(option('',copy('allShops')),...meta.shops.map(shop=>option(shop.code,shop.code+' · '+shop.name+(shop.has_journal?'':' · '+copy('noJournal'))+(shop.in_system?'':' · '+copy('notInSystem')))));
 const firstWithSales=meta.shops.find(shop=>shop.has_journal);
 $('crm-shop').value=crm.shopChosen&&(previousShop===''||meta.shops.some(shop=>shop.code===previousShop))?previousShop:(firstWithSales?firstWithSales.code:'');
 const ends=[meta.journal.end,meta.line.end].filter(Boolean).sort(),starts=[meta.journal.start,meta.line.start].filter(Boolean).sort();
 const latest=ends[ends.length-1],earliest=starts[0];
 const choices=[option('',C.periods.all)];
 if(latest){
  for(const [key,days] of Object.entries(C.lastDays)){const from=new Date(latest+'T00:00:00Z');from.setUTCDate(from.getUTCDate()-days+1);choices.push(option(from.toISOString().slice(0,10)+'|'+latest,C.periods[key]));}
  const cursor=new Date(earliest.slice(0,7)+'-01T00:00:00Z'),stop=new Date(latest.slice(0,7)+'-01T00:00:00Z'),months=[];
  while(cursor<=stop){const first=cursor.toISOString().slice(0,10);const next=new Date(cursor);next.setUTCMonth(next.getUTCMonth()+1);const last=new Date(next-1).toISOString().slice(0,10);months.unshift(option(first+'|'+last,monthName.format(new Date(first+'T00:00:00'+CONFIG.offset))));cursor.setUTCMonth(cursor.getUTCMonth()+1);}
  choices.push(...months);

 $('crm-period').replaceChildren(...choices);

 const range=part=>part.start?day(part.start)+' – '+day(part.end):copy('noData');

// ── Uploads ────────────────────────────────────────────────────────────────
function renderUploads(uploads){

  return node('li',{},node('span',{class:'badge '+upload.kind,text:C.kinds[upload.kind]||upload.kind}),node('div',{},node('span',{class:'name',text:upload.filename}),node('small',{text:copy('uploadRow',{range,count})})),node('small',{text:when(upload.created)}));

// ── Charts ─────────────────────────────────────────────────────────────────
function niceTicks(max,count){
 if(!(max>0))return [0,1];
 const raw=max/count,power=Math.pow(10,Math.floor(Math.log10(raw))),unit=raw/power;
 const step=(unit<=1?1:unit<=2?2:unit<=5?5:10)*power,ticks=[];
 for(let value=0;value<=max+step*1e-9;value+=step)ticks.push(value);
 if(ticks[ticks.length-1]<max)ticks.push(ticks[ticks.length-1]+step);
 return ticks;
}
const compact=new Intl.NumberFormat(CONFIG.locale,{notation:'compact',maximumFractionDigits:1});
function roundedTop(x,y,width,height,radius){const r=Math.min(radius,height,width/2);return `M${x},${y+height}V${y+r}Q${x},${y} ${x+r},${y}H${x+width-r}Q${x+width},${y} ${x+width},${y+r}V${y+height}Z`;}
function columnChart(host,rows,spec){

}
function drawColumns(host,rows,spec){
 const g=C.chart,m=g.margin,width=Math.max(host.clientWidth,g.minWidth),height=g.height;
 const values=rows.map(spec.value),max=Math.max(0,...values),ticks=niceTicks(max,g.ticks),top=ticks[ticks.length-1]||1;
 const plotW=width-m.left-m.right,plotH=height-m.top-m.bottom,band=plotW/Math.max(rows.length,1),barW=Math.max(1,Math.min(g.barMax,band*g.barRatio));
 const chart=svg('svg',{viewBox:`0 0 ${width} ${height}`,role:'img','aria-label':spec.title});
 for(const tick of ticks){const y=m.top+plotH-(tick/top)*plotH;chart.append(svg('line',{x1:m.left,x2:width-m.right,y1:y,y2:y,class:'grid'}),svg('text',{x:m.left-g.tickGap,y,'text-anchor':'end','dominant-baseline':'middle'},compact.format(tick)));}
 const every=Math.max(1,Math.ceil(rows.length/Math.max(1,Math.floor(plotW/g.labelGap))));
 const peak=values.indexOf(max),hits=[];
 rows.forEach((row,index)=>{
  const value=values[index],x=m.left+index*band+(band-barW)/2,h=(value/top)*plotH,y=m.top+plotH-h;
  const bar=h>0?svg('path',{d:roundedTop(x,y,barW,h,g.radius),class:'bar'+(index===peak&&max>0?' peak':'')}):null;
  if(bar)chart.append(bar);
  hits.push([svg('rect',{x:m.left+index*band,y:m.top,width:band,height:plotH,class:'hit'}),bar,row]);
  if(index%every===0)chart.append(svg('text',{x:x+barW/2,y:height-m.bottom+g.labelOffset,'text-anchor':'middle'},spec.label(row)));
  if(index===peak&&max>0)chart.append(svg('text',{x:x+barW/2,y:y-g.peakGap,'text-anchor':'middle',class:'peak-label'},spec.short(value)));
 });
 chart.append(svg('line',{x1:m.left,x2:width-m.right,y1:m.top+plotH,y2:m.top+plotH,class:'base'}));
 // Hit areas go last so they sit above bars and labels: the whole column band answers the pointer.
 for(const [hit,bar,row] of hits){hit.addEventListener('pointermove',event=>{bar?.classList.add('on');showTip(event,spec.tip(row));});hit.addEventListener('pointerleave',()=>{bar?.classList.remove('on');hideTip();});chart.append(hit);}

}
function drawCharts(){for(const chart of crm.charts)if(chart.host.isConnected&&chart.host.clientWidth)drawColumns(chart.host,chart.rows,chart.spec);}
window.addEventListener('resize',()=>{cancelAnimationFrame(crm.resizeFrame);crm.resizeFrame=requestAnimationFrame(drawCharts);});
function showTip(event,lines){

function hideTip(){$('crm-tip').hidden=true;}
function barList(rows,spec){

  const value=spec.value(row),item=node('li',{},node('span',{class:'bar-label',text:spec.label(row)}),node('span',{class:'bar-track'},node('span',{class:'bar-fill',style:'--w:'+(max?value/max*100:0)+'%'})),node('span',{class:'bar-value',text:spec.format(value)}),spec.sub?node('span',{class:'bar-sub',text:spec.sub(row)}):null);

function tableView(rows){

}

// ── Render CRM ─────────────────────────────────────────────────────────────
function renderCrm(){

  metric('beans',copy('kpiRevenue'),baht(k.revenue)),
  metric('coffee',copy('kpiAvg'),baht(k.avg_bill)),
  metric('scan',copy('kpiScan'),percent.format(l.scan_rate),copy('kpiScanSub',{claims:number.format(l.claims),points:number.format(l.points)})));

  card(copy('chartDaily'),copy('chartDailyNote'),[daily,tableView(data.daily.map(row=>[day(row.day),baht(row.revenue)+' · '+copy('billsUnit',{value:number.format(row.bills)})]))],true),
  card(copy('chartHourly'),copy('chartHourlyNote'),[hourly,tableView(data.hourly.filter(row=>row.bills).map(row=>[copy('hourLabel',{hour:String(row.hour).padStart(2,'0')}),copy('billsUnit',{value:number.format(row.bills)})+(row.top_item?' · '+row.top_item:'')]))]),
  card(copy('chartWeekday'),'',[weekly,tableView(data.weekday.map(row=>[C.weekdays[row.weekday],copy('billsUnit',{value:number.format(row.bills)})+' · '+baht(row.revenue)]))]),
  card(copy('chartTop'),copy('chartTopNote'),barList(data.top_items,{label:row=>row.name,value:row=>row.qty,format:value=>number.format(value),sub:row=>baht(row.revenue)+' · '+copy('billsUnit',{value:number.format(row.bills)}),tip:row=>[copy('cups',{value:number.format(row.qty)}),row.name,baht(row.revenue)]})),
  card(copy('chartOptions'),copy('chartOptionsNote'),barList(data.options,{label:row=>row.name,value:row=>row.qty,format:value=>number.format(value),sub:row=>percent.format(row.qty/(optionTotal||1))})),
  card(copy('chartDiscounts'),copy('chartDiscountsNote'),barList(data.discounts,{label:row=>row.name,value:row=>row.bills,format:value=>copy('billsUnit',{value:number.format(value)}),sub:row=>baht(row.amount)})),
  card(copy('chartPayments'),'',[barList(data.payments,{label:row=>row.name,value:row=>row.bills,format:value=>copy('billsUnit',{value:number.format(value)}),sub:row=>baht(row.amount)+' · '+percent.format(row.bills/k.bills)}),node('h2',{text:copy('chartModes'),style:'margin-top:var(--panel-pad)'}),barList(data.sale_modes,{label:row=>row.name||copy('dash'),value:row=>row.bills,format:value=>copy('billsUnit',{value:number.format(value)}),sub:row=>baht(row.amount)})]));

 columnChart(hourly,data.hourly,{title:copy('chartHourly'),value:row=>row.bills,label:row=>String(row.hour).padStart(2,'0'),short:value=>number.format(value),tip:row=>[copy('billsUnit',{value:number.format(row.bills)}),copy('hourLabel',{hour:String(row.hour).padStart(2,'0')})+' · '+baht(row.revenue),row.top_item?copy('tipTopItem',{name:row.top_item}):'']});
 columnChart(weekly,data.weekday,{title:copy('chartWeekday'),value:row=>row.bills,label:row=>C.weekdays[row.weekday],short:value=>number.format(value),tip:row=>[copy('billsUnit',{value:number.format(row.bills)}),C.weekdays[row.weekday],baht(row.revenue)]});
}
function dataTable(columns,rows,label){
 const head=node('tr',{},...columns.map(([label])=>node('th',{scope:'col',text:label})));
 const body=rows.map((row,index)=>node('tr',{},...columns.map(([,cell,numeric])=>{const value=cell(row,index);return node('td',{class:numeric?'number':null},value instanceof Node?value:document.createTextNode(value??copy('dash')));})));
 return node('div',{class:'table-scroll',tabindex:'0',role:'region','aria-label':label},node('table',{},node('thead',{},head),node('tbody',{},...body)));
}
function renderCustomers(data){
 const host=$('crm-customers');
 if(data.empty){host.replaceChildren(node('p',{class:'empty-state',text:copy('customersEmpty')}));return;}
 const k=data.kpi;
 const kpis=node('div',{class:'metrics',style:'padding:var(--panel-pad);margin:0'},
  metric('customer',copy('kpiCustomers'),copy('people',{value:number.format(k.customers)})),
  metric('repeat',copy('kpiRepeat'),percent.format(k.repeat_rate),copy('kpiRepeatSub',{repeat:number.format(k.repeat)})),
  metric('calendar',copy('kpiVisits'),copy('times',{value:average.format(k.avg_visits)})),
  metric('profile',copy('kpiNew'),copy('people',{value:number.format(k.new)})));
 const buckets=barList(data.buckets,{label:row=>row.to===null?copy('bucketOpen',{from:row.from}):row.to===row.from?copy('bucketOne',{from:row.from}):copy('bucketLabel',{from:row.from,to:row.to}),value:row=>row.customers,format:value=>copy('people',{value:number.format(value)}),sub:row=>percent.format(row.customers/(k.customers||1))});
 const columns=[[copy('colRow'),(row,index)=>number.format(index+1),true],
  [copy('colCustomer'),row=>node('span',{title:row.customer_id,text:shortId(row.customer_id)})],
  [copy('colVisits'),row=>copy('daysUnit',{value:number.format(row.visits)}),true],
  [copy('colPoints'),row=>number.format(row.points),true],
  [copy('colFirst'),row=>moment(row.first)],[copy('colLast'),row=>moment(row.last)],
  [copy('colGap'),row=>row.avg_gap_days===null?null:average.format(row.avg_gap_days),true],
  [copy('colReceipts'),row=>number.format(row.receipts),true],
  [copy('colItems'),row=>row.items.length?row.items.map(item=>item.name+' ×'+number.format(item.qty)).join(', '):null]];
 host.replaceChildren(kpis,
  node('div',{class:'crm-grid',style:'padding:0 var(--panel-pad)'},card(copy('bucketsTitle'),'',buckets)),
  node('h2',{text:copy('topCustomers'),style:'padding:0 var(--panel-pad) var(--gap)'}),
  dataTable(columns,data.top,copy('topCustomers')));
}
function statusChip(key,count){const conf=C.statuses[key]||{label:key,tone:'info'};return node('span',{class:'chip '+conf.tone},node('span',{text:conf.label}),count!==undefined?node('strong',{text:number.format(count)}):null);}
function renderMatch(data){
 const host=$('crm-match');
 const minutes=Math.round(data.window_seconds/C.secondsPerMinute);
 $('crm-match-note').textContent=copy('matchNote',{window:number.format(minutes),typical:data.typical_gap_seconds===null||data.typical_gap_seconds===undefined?'':copy(data.typical_gap_seconds<0?'matchEarlier':'matchLater',{gap:number.format(Math.abs(data.typical_gap_seconds))})});
 if(!data.rows.length){host.replaceChildren(node('p',{class:'empty-state',text:copy('matchEmpty'),style:'margin:var(--panel-pad)'}));return;}
 const chips=node('div',{class:'chips'},...Object.keys(C.statuses).filter(key=>data.counts[key]).map(key=>statusChip(key,data.counts[key])));
 const rows=[...data.rows].reverse();
 const columns=[[copy('colRow'),(row,index)=>number.format(index+1),true],
  [copy('colShop'),row=>row.shop_code],[copy('colBill'),row=>row.bill_no+' · '+day(row.bill_date)],
  [copy('colAmount'),row=>baht(row.amount),true],[copy('colPos'),row=>row.pos_total===null?null:baht(row.pos_total),true],
  [copy('colOurPoints'),row=>number.format(row.points),true],[copy('colLinePoints'),row=>row.line_points===null?null:number.format(row.line_points),true],
  [copy('colClicked'),row=>row.clicked_at?moment(row.clicked_at):null],[copy('colLineAt'),row=>row.line_at?moment(row.line_at):null],
  [copy('colGapSec'),row=>row.gap_seconds===null?null:node('span',{title:copy('colGapHint'),text:number.format(row.gap_seconds)}),true],
  [copy('colCustomer'),row=>row.line_customer?node('span',{title:row.line_customer,text:shortId(row.line_customer)}):null],
  [copy('colItems'),row=>row.items.length?row.items.map(item=>item.name+(item.qty===1?'':' ×'+number.format(item.qty))).join(', '):null],
  [copy('colStatus'),row=>node('div',{class:'flags'},...(row.flags.length?row.flags:['ok']).map(flag=>statusChip(flag)))]];
 host.replaceChildren(chips,dataTable(columns,rows,copy('matchTable')));
}

// ── Inbox ──────────────────────────────────────────────────────────────────
async function loadInbox(){
 if(!state.token||state.busy)return;
 busy(true);$('inbox-error').hidden=true;
 try{crm.inbox=await (await api('/feedback')).json();renderInbox();}
 catch(error){if(state.token){$('inbox-error-text').textContent=error.message;$('inbox-error').hidden=false;status(error.message,true);}}
 finally{busy(false);}
}
function renderInbox(){
 const data=crm.inbox;if(!data)return;
 const total=Object.values(data.counts).reduce((sum,count)=>sum+count,0);
 const filters=[['',copy('inboxAll'),total],...Object.entries(F.statuses).map(([key,label])=>[key,label,data.counts[key]||0])];
 $('inbox-filter').replaceChildren(...filters.map(([key,label,count])=>node('button',{type:'button',class:'chip','aria-pressed':String(crm.inboxFilter===key),onclick:()=>{crm.inboxFilter=key;renderInbox();}},node('span',{text:label}),node('strong',{text:number.format(count)}))));
 const items=data.items.filter(item=>!crm.inboxFilter||item.status===crm.inboxFilter);
 $('inbox-empty').hidden=items.length>0;
 $('inbox-list').replaceChildren(...items.map(item=>{
  const select=node('select',{'aria-label':copy('fbStatus')},...Object.entries(F.statuses).map(([key,label])=>option(key,label)));select.value=item.status;
  select.addEventListener('change',()=>saveStatus(item,select));
  const thumbs=node('ul',{class:'thumbs'},...item.images.map((image,index)=>{const img=node('img',{alt:copy('attachmentAlt',{n:index+1})});const button=node('button',{type:'button',class:'secondary','aria-label':copy('attachmentAlt',{n:index+1}),onclick:()=>openImage(image.id)},img);loadThumb(image.id,img);return node('li',{},button);}));
  return node('li',{class:'fb-card','data-status':item.status},
   node('div',{class:'fb-head'},node('span',{class:'badge '+item.kind,text:F.kinds[item.kind]?.label||item.kind}),node('h2',{text:item.topic}),node('label',{class:'fb-status'},node('span',{text:copy('fbStatus')}),select)),
   node('p',{class:'fb-detail',text:item.detail}),item.images.length?thumbs:null,
   node('p',{class:'fb-meta',text:copy('inboxMeta',{time:when(item.created),reporter:item.reporter||copy('anonymous'),page:item.page||copy('dash')})}));
 }));
}
async function imageUrl(id){
 if(crm.images.has(id))return crm.images.get(id);
 const blob=await (await api('/feedback/image/'+id)).blob();const url=URL.createObjectURL(blob);crm.images.set(id,url);return url;
}
async function loadThumb(id,img){try{img.src=await imageUrl(id);}catch{}}
async function openImage(id){try{$('image-holder').replaceChildren(node('img',{id:'image-view',src:await imageUrl(id),alt:copy('imageTitle')}));$('image-dialog').showModal();}catch(error){status(error.message,true);}}
async function saveStatus(item,select){
 const previous=item.status;busy(true);
 try{await api('/feedback/'+item.id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:select.value})});crm.inbox.counts[previous]--;crm.inbox.counts[select.value]=(crm.inbox.counts[select.value]||0)+1;item.status=select.value;status(copy('statusSaved'));}
 catch(error){select.value=previous;status(error.message,true);}
 finally{busy(false);renderInbox();}
}

// ── Feedback form ──────────────────────────────────────────────────────────
function fbMessage(message='',error=false){$('feedback-message').textContent=message;$('feedback-message').dataset.error=String(error);}
function resetFeedback(){
 for(const attachment of crm.attachments)URL.revokeObjectURL(attachment.url);crm.attachments=[];
 $('feedback-form').reset();renderAttachments();fbMessage();
}
function openFeedback(){
 if(!state.token)return;
 fbMessage();$('feedback-dialog').showModal();
 (document.querySelector('#fb-kinds input:checked')||document.querySelector('#fb-kinds input'))?.focus();
}
function addAttachment(blob){
 if(crm.attachments.length>=F.maxImages){fbMessage(copy('fbTooMany',{max:F.maxImages}),true);return false;}
 if(!blob.type.startsWith('image/')){fbMessage(copy('fbNotImage'),true);return false;}
 crm.attachments.push({blob,url:URL.createObjectURL(blob)});renderAttachments();return true;
}
function renderAttachments(){
 $('fb-attachments').replaceChildren(...crm.attachments.map((attachment,index)=>node('li',{},
  node('img',{src:attachment.url,alt:copy('attachmentAlt',{n:index+1})}),
  node('div',{},node('button',{type:'button',class:'secondary',text:copy('fbDraw'),onclick:()=>openAnnotate(index)}),
   node('button',{type:'button',class:'secondary',text:copy('fbRemove'),onclick:()=>{URL.revokeObjectURL(attachment.url);crm.attachments.splice(index,1);renderAttachments();}})))));
 $('fb-pick').disabled=$('fb-capture').disabled=crm.attachments.length>=F.maxImages;
}
async function captureScreen(){
 if(!navigator.mediaDevices?.getDisplayMedia){fbMessage(copy('captureUnsupported'),true);return;}
 const dialog=$('feedback-dialog');dialog.close();let stream=null,added=false;
 try{
  stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false,preferCurrentTab:true});
  const video=document.createElement('video');video.srcObject=stream;video.muted=true;await video.play();
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,F.imageType));
  if(blob)added=addAttachment(blob);
 }catch{fbMessage(copy('captureCancelled'));}
 finally{stream?.getTracks().forEach(track=>track.stop());if(state.token){dialog.showModal();if(added)openAnnotate(crm.attachments.length-1);}}
}
async function sendFeedback(event){
 event.preventDefault();if(state.busy||!state.token)return;
 const kind=document.querySelector('#fb-kinds input:checked')?.value||'',topic=$('fb-topic').value.trim(),detail=$('fb-detail').value.trim();
 for(const [id,bad] of [['fb-topic',!topic],['fb-detail',!detail]])$(id).setAttribute('aria-invalid',String(bad));
 if(!kind){fbMessage(copy('fbNeedKind'),true);document.querySelector('#fb-kinds input')?.focus();return;}
 if(!topic){fbMessage(copy('fbNeedTopic'),true);$('fb-topic').focus();return;}
 if(!detail){fbMessage(copy('fbNeedDetail'),true);$('fb-detail').focus();return;}
 const form=new FormData();form.append('kind',kind);form.append('topic',topic);form.append('detail',detail);form.append('reporter',$('fb-reporter').value.trim());
 form.append('page',document.querySelector('[data-view-target][aria-current=page]')?.textContent||'');
 crm.attachments.forEach((attachment,index)=>form.append('image',attachment.blob,'image-'+(index+1)+'.png'));
 busy(true);fbMessage(copy('fbSending'));
 try{await api('/feedback',{method:'POST',body:form});resetFeedback();$('feedback-dialog').close();status(copy('fbSent'));if(crm.view==='inbox'){busy(false);await loadInbox();}}
 catch(error){fbMessage(error.message,true);}
 finally{busy(false);renderAttachments();}
}

// ── Annotation ─────────────────────────────────────────────────────────────
function openAnnotate(index){
 const attachment=crm.attachments[index];if(!attachment)return;
 const image=new Image();
 image.onload=()=>{
  const scale=Math.min(1,F.maxPx/Math.max(image.naturalWidth,image.naturalHeight)),canvas=$('annotate-canvas');
  canvas.width=Math.round(image.naturalWidth*scale);canvas.height=Math.round(image.naturalHeight*scale);
  crm.annotate={index,image,shapes:[],current:null,tool:Object.keys(F.tools)[0],color:F.colors[0].value,width:Math.max(F.stroke,canvas.width*F.strokeRatio)};
  renderTools();redraw();$('annotate-dialog').showModal();
 };
 image.src=attachment.url;
}
function renderTools(){
 const a=crm.annotate,tools=$('annotate-tools');
 tools.replaceChildren(
  ...Object.entries(F.tools).map(([key,label])=>node('button',{type:'button',class:'secondary','aria-pressed':String(a.tool===key),text:label,onclick:()=>{a.tool=key;renderTools();}})),
  node('span',{class:'tool-sep','aria-hidden':'true'}),
  ...F.colors.map(color=>node('button',{type:'button',class:'secondary swatch','aria-pressed':String(a.color===color.value),'aria-label':copy('annotateColor',{color:color.label}),title:color.label,onclick:()=>{a.color=color.value;renderTools();}},node('span',{style:'--swatch:'+color.value}))),
  node('span',{class:'tool-sep','aria-hidden':'true'}),
  node('button',{type:'button',class:'secondary',onclick:()=>{a.shapes.pop();redraw();}},localIcon('undo'),document.createTextNode(copy('annotateUndo'))),
  node('button',{type:'button',class:'secondary',text:copy('annotateClear'),onclick:()=>{a.shapes=[];redraw();}}));
}
function redraw(){
 const a=crm.annotate;if(!a)return;const canvas=$('annotate-canvas'),ctx=canvas.getContext('2d');
 ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(a.image,0,0,canvas.width,canvas.height);
 for(const shape of [...a.shapes,a.current].filter(Boolean)){
  ctx.strokeStyle=shape.color;ctx.lineWidth=shape.width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  if(shape.tool==='pen'){shape.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));}
  else{const {from,to}=shape;
   if(shape.tool==='circle')ctx.ellipse((from.x+to.x)/2,(from.y+to.y)/2,Math.abs(to.x-from.x)/2,Math.abs(to.y-from.y)/2,0,0,Math.PI*2);
   else if(shape.tool==='rect')ctx.rect(from.x,from.y,to.x-from.x,to.y-from.y);
   else{const angle=Math.atan2(to.y-from.y,to.x-from.x),head=shape.width*F.arrowScale;ctx.moveTo(from.x,from.y);ctx.lineTo(to.x,to.y);for(const side of [1,-1])ctx.moveTo(to.x,to.y),ctx.lineTo(to.x-head*Math.cos(angle-side*F.arrowAngle),to.y-head*Math.sin(angle-side*F.arrowAngle));}}
  ctx.stroke();
 }
}
function point(event){const canvas=$('annotate-canvas'),box=canvas.getBoundingClientRect();return {x:(event.clientX-box.left)*canvas.width/box.width,y:(event.clientY-box.top)*canvas.height/box.height};}
$('annotate-canvas').addEventListener('pointerdown',event=>{const a=crm.annotate;if(!a)return;event.preventDefault();event.target.setPointerCapture(event.pointerId);const p=point(event);a.current=a.tool==='pen'?{tool:'pen',color:a.color,width:a.width,points:[p]}:{tool:a.tool,color:a.color,width:a.width,from:p,to:p};redraw();});
$('annotate-canvas').addEventListener('pointermove',event=>{const a=crm.annotate;if(!a?.current)return;const p=point(event);if(a.current.tool==='pen')a.current.points.push(p);else a.current.to=p;redraw();});
for(const type of ['pointerup','pointercancel'])$('annotate-canvas').addEventListener(type,()=>{const a=crm.annotate;if(!a?.current)return;a.shapes.push(a.current);a.current=null;redraw();});
$('annotate-save').addEventListener('click',()=>{const a=crm.annotate;if(!a)return;$('annotate-canvas').toBlob(blob=>{if(!blob)return;const attachment=crm.attachments[a.index];if(attachment){URL.revokeObjectURL(attachment.url);attachment.blob=blob;attachment.url=URL.createObjectURL(blob);}crm.annotate=null;$('annotate-dialog').close();renderAttachments();},F.imageType);});
$('annotate-cancel').addEventListener('click',()=>$('annotate-dialog').close());
$('annotate-dialog').addEventListener('close',()=>{crm.annotate=null;});

// ── Wiring ─────────────────────────────────────────────────────────────────
document.querySelectorAll('[data-view-target]').forEach(tab=>tab.addEventListener('click',()=>showView(tab.dataset.viewTarget)));
$('crm-shop').addEventListener('change',()=>{crm.shopChosen=true;loadCrm();});$('crm-period').addEventListener('change',loadCrm);
$('crm-filters').addEventListener('submit',event=>{event.preventDefault();loadCrm();});
$('crm-retry').addEventListener('click',()=>crm.meta?loadCrm():crmStart());$('inbox-retry').addEventListener('click',loadInbox);
$('crm-file').addEventListener('change',event=>{uploadFiles([...event.target.files]);event.target.value='';});
const drop=$('crm-drop');
for(const type of ['dragenter','dragover'])drop.addEventListener(type,event=>{event.preventDefault();drop.classList.add('dragover');});
for(const type of ['dragleave','drop'])drop.addEventListener(type,()=>drop.classList.remove('dragover'));
drop.addEventListener('drop',event=>{event.preventDefault();uploadFiles([...event.dataTransfer.files]);});
$('feedback-open').addEventListener('click',openFeedback);$('inbox-new').addEventListener('click',openFeedback);
$('feedback-cancel').addEventListener('click',()=>$('feedback-dialog').close());$('feedback-cancel-top').addEventListener('click',()=>$('feedback-dialog').close());
$('feedback-form').addEventListener('submit',sendFeedback);
$('fb-pick').addEventListener('click',()=>$('fb-file').click());
$('fb-file').addEventListener('change',event=>{for(const file of event.target.files)if(!addAttachment(file))break;event.target.value='';});
$('fb-capture').addEventListener('click',captureScreen);
$('feedback-dialog').addEventListener('paste',event=>{for(const item of event.clipboardData?.items||[])if(item.type.startsWith('image/')){const file=item.getAsFile();if(file){event.preventDefault();addAttachment(file);}}});
$('image-close').addEventListener('click',()=>$('image-dialog').close());$('image-dialog').addEventListener('close',()=>$('image-holder').replaceChildren());
$('fb-kinds').append(...Object.entries(F.kinds).map(([key,kind])=>node('label',{},node('input',{type:'radio',name:'fb-kind',value:key}),node('strong',{text:kind.label}),node('small',{text:kind.hint}))));
$('fb-topics').append(...F.topics.map(topic=>node('option',{value:topic})));
document.querySelector('[data-copy="fbImages"]').textContent=copy('fbImages',{max:F.maxImages});
document.querySelectorAll('[data-copy-placeholder]').forEach(el=>el.placeholder=copy(el.dataset.copyPlaceholder));
document.querySelectorAll('[data-copy-label]').forEach(el=>el.setAttribute('aria-label',copy(el.dataset.copyLabel)));
renderAttachments();
</script>
